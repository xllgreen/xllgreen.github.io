<div class="tool-wrap">
<h1 class="tool-page-heading">是或否决策器</h1>
    <div class="tool-main" role="main">
      <div class="container">
        <div class="main-area">
          <input
            type="text"
            class="question-input"
            id="questionInput"
            placeholder="输入你的问题... (可选)"
            maxlength="100"
          />

          <div class="mode-selector">
            <button class="mode-btn active" data-mode="binary" onclick="setMode('binary')">
              是/否
            </button>
            <button class="mode-btn" data-mode="ternary" onclick="setMode('ternary')">
              是/否/也许
            </button>
          </div>

          <div class="oracle-container">
            <div class="oracle-ball" id="oracleBall" onclick="askOracle()">
              <div class="oracle-window">
                <div class="oracle-answer" id="oracleAnswer">8</div>
              </div>
            </div>
          </div>

          <button class="ask-btn" id="askBtn" onclick="askOracle()">🔮 询问命运</button>
          <div class="shake-hint">💡 点击水晶球或摇动手机</div>
        </div>

        <div class="stats-panel">
          <div class="stats-title">📊 统计</div>
          <div class="stats-bars">
            <div class="stat-item">
              <div class="stat-circle yes" id="yesCount">0</div>
              <div class="stat-label">是</div>
            </div>
            <div class="stat-item">
              <div class="stat-circle no" id="noCount">0</div>
              <div class="stat-label">否</div>
            </div>
            <div class="stat-item" id="maybeStatItem" style="display: none">
              <div class="stat-circle maybe" id="maybeCount">0</div>
              <div class="stat-label">也许</div>
            </div>
          </div>
          <div class="stat-total">
            总计询问
            <span id="totalCount">0</span>
            次
          </div>
        </div>

        <div class="history-panel">
          <div class="history-header">
            <span class="stats-title" style="margin: 0">📜 历史记录</span>
            <button class="history-clear" onclick="clearHistory()">清空</button>
          </div>
          <div class="history-list" id="historyList">
            <div class="empty-state">暂无记录</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 答案库
      const answers = {
        yes: [
          { text: "是", emoji: "✅" },
          { text: "当然", emoji: "👍" },
          { text: "毫无疑问", emoji: "💯" },
          { text: "一定的", emoji: "🎯" },
          { text: "必然如此", emoji: "⭐" },
          { text: "放心去做", emoji: "🚀" },
          { text: "命中注定", emoji: "✨" },
          { text: "大吉大利", emoji: "🍀" }
        ],
        no: [
          { text: "否", emoji: "❌" },
          { text: "不行", emoji: "🙅" },
          { text: "别想了", emoji: "🚫" },
          { text: "不太可能", emoji: "😕" },
          { text: "前景堪忧", emoji: "⚠️" },
          { text: "算了吧", emoji: "💭" },
          { text: "另谋他路", emoji: "🔄" },
          { text: "时机未到", emoji: "⏳" }
        ],
        maybe: [
          { text: "也许吧", emoji: "🤔" },
          { text: "不确定", emoji: "❓" },
          { text: "再想想", emoji: "💭" },
          { text: "天机不可泄露", emoji: "🔮" },
          { text: "随缘", emoji: "☯️" },
          { text: "一半一半", emoji: "⚖️" }
        ]
      };

      let mode = "binary"; // binary 或 ternary
      let isAsking = false;
      let stats = JSON.parse(
        localStorage.getItem("yesNoStats") || '{"yes":0,"no":0,"maybe":0,"history":[]}'
      );

      // 音频
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      function playMysticSound() {
        initAudio();
        // 神秘音效
        const freqs = [220, 277.18, 329.63, 440];
        freqs.forEach((freq, i) => {
          setTimeout(() => {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = freq;
            oscillator.type = "sine";
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
          }, i * 150);
        });
      }

      function playResultSound(type) {
        initAudio();
        const freq = type === "yes" ? 523.25 : type === "no" ? 261.63 : 392;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.frequency.value = freq;
        oscillator.type = "sine";
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.5);
      }

      function secureRandom() {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        return array[0] / (0xffffffff + 1);
      }

      // HTML 转义函数 (防止 XSS)
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function setMode(newMode) {
        mode = newMode;
        document.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === newMode);
        });
        document.getElementById("maybeStatItem").style.display =
          newMode === "ternary" ? "block" : "none";
      }

      function askOracle() {
        if (isAsking) return;
        isAsking = true;

        initAudio();
        const ball = document.getElementById("oracleBall");
        const answer = document.getElementById("oracleAnswer");
        const askBtn = document.getElementById("askBtn");

        askBtn.disabled = true;
        answer.classList.remove("show", "yes", "no", "maybe");
        answer.textContent = "...";

        ball.classList.add("shaking");
        playMysticSound();

        // 决定结果类型
        let resultType;
        const rand = secureRandom();
        if (mode === "binary") {
          resultType = rand < 0.5 ? "yes" : "no";
        } else {
          if (rand < 0.4) resultType = "yes";
          else if (rand < 0.8) resultType = "no";
          else resultType = "maybe";
        }

        // 随机选择一个答案
        const answerPool = answers[resultType];
        const selectedAnswer = answerPool[Math.floor(secureRandom() * answerPool.length)];

        setTimeout(() => {
          ball.classList.remove("shaking");

          // 显示答案
          answer.innerHTML = `${selectedAnswer.emoji}<br>${selectedAnswer.text}`;
          answer.classList.add("show", resultType);

          playResultSound(resultType);

          // 更新统计
          stats[resultType]++;

          // 添加历史
          const question = document.getElementById("questionInput").value.trim() || "(未输入问题)";
          stats.history.unshift({
            question,
            answer: selectedAnswer.text,
            type: resultType,
            time: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })
          });
          if (stats.history.length > 30) stats.history.pop();

          localStorage.setItem("yesNoStats", JSON.stringify(stats));
          updateUI();

          isAsking = false;
          askBtn.disabled = false;
        }, 1500);
      }

      function updateUI() {
        document.getElementById("yesCount").textContent = stats.yes;
        document.getElementById("noCount").textContent = stats.no;
        document.getElementById("maybeCount").textContent = stats.maybe;
        document.getElementById("totalCount").textContent = stats.yes + stats.no + stats.maybe;

        renderHistory();
      }

      function renderHistory() {
        const list = document.getElementById("historyList");
        if (stats.history.length === 0) {
          list.innerHTML = '<div class="empty-state">暂无记录</div>';
          return;
        }
        list.innerHTML = stats.history
          .map(
            (h) => `
                <div class="history-item">
                    <span class="history-question" title="${escapeHtml(h.question)}">${escapeHtml(h.question)}</span>
                    <span class="history-answer ${escapeHtml(h.type)}">${escapeHtml(h.answer)}</span>
                </div>
            `
          )
          .join("");
      }

      function clearHistory() {
        stats = { yes: 0, no: 0, maybe: 0, history: [] };
        localStorage.setItem("yesNoStats", JSON.stringify(stats));
        document.getElementById("oracleAnswer").classList.remove("show");
        document.getElementById("oracleAnswer").textContent = "8";
        updateUI();
      }

      // 摇动检测
      let lastShake = 0;
      if (window.DeviceMotionEvent) {
        window.addEventListener("devicemotion", (e) => {
          const acc = e.accelerationIncludingGravity;
          if (acc) {
            const total = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
            if (total > 35 && Date.now() - lastShake > 2000) {
              lastShake = Date.now();
              askOracle();
            }
          }
        });
      }

      // 键盘
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "Enter") {
          if (document.activeElement.id !== "questionInput") {
            e.preventDefault();
            askOracle();
          } else if (e.code === "Enter") {
            e.preventDefault();
            askOracle();
          }
        }
      });

      function toggleTheme() {
        const body = document.body;
        const current = body.getAttribute("data-theme");
        const next = current === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      }

      // 初始化
      document.body.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
      updateUI();
    </script>

    <!-- 全局 UI 注入 -->
</div>
