    <script>
      const formulas = [
        // 力学
        {
          cat: "mechanics",
          name: "牛顿第二定律",
          eq: "F = ma",
          desc: "物体加速度与合外力成正比，与质量成反比",
          vars: "F:力(N), m:质量(kg), a:加速度(m/s²)"
        },
        {
          cat: "mechanics",
          name: "万有引力定律",
          eq: "F = G·m₁m₂/r²",
          desc: "两物体间的引力与质量乘积成正比，与距离平方成反比",
          vars: "G=6.67×10⁻¹¹ N·m²/kg², r:距离(m)"
        },
        {
          cat: "mechanics",
          name: "重力",
          eq: "G = mg",
          desc: "物体所受重力等于质量乘以重力加速度",
          vars: "g≈9.8m/s²(地表), G:重力(N)"
        },
        {
          cat: "mechanics",
          name: "弹簧弹力",
          eq: "F = kx",
          desc: "胡克定律：弹簧弹力与形变量成正比",
          vars: "k:劲度系数(N/m), x:形变量(m)"
        },
        {
          cat: "mechanics",
          name: "滑动摩擦力",
          eq: "f = μN",
          desc: "滑动摩擦力等于动摩擦因数乘以正压力",
          vars: "μ:动摩擦因数, N:正压力(N)"
        },
        {
          cat: "mechanics",
          name: "压强",
          eq: "p = F/S",
          desc: "压强等于压力除以受力面积",
          vars: "p:压强(Pa), F:压力(N), S:面积(m²)"
        },
        {
          cat: "mechanics",
          name: "液体压强",
          eq: "p = ρgh",
          desc: "液体内部压强与深度成正比",
          vars: "ρ:液体密度(kg/m³), h:深度(m)"
        },

        // 运动学
        {
          cat: "kinematics",
          name: "匀速直线运动",
          eq: "s = vt",
          desc: "位移等于速度乘以时间",
          vars: "s:位移(m), v:速度(m/s), t:时间(s)"
        },
        {
          cat: "kinematics",
          name: "匀变速直线运动速度",
          eq: "v = v₀ + at",
          desc: "末速度等于初速度加上加速度乘以时间",
          vars: "v₀:初速度, v:末速度, a:加速度"
        },
        {
          cat: "kinematics",
          name: "匀变速直线运动位移",
          eq: "s = v₀t + ½at²",
          desc: "位移公式",
          vars: "s:位移, v₀:初速度, a:加速度, t:时间"
        },
        {
          cat: "kinematics",
          name: "速度位移关系",
          eq: "v² - v₀² = 2as",
          desc: "速度平方差等于2倍加速度乘位移",
          vars: "不含时间t的公式"
        },
        {
          cat: "kinematics",
          name: "平均速度",
          eq: "v̄ = (v₀+v)/2",
          desc: "匀变速运动的平均速度等于初末速度的算术平均",
          vars: "仅适用于匀变速运动"
        },
        {
          cat: "kinematics",
          name: "自由落体",
          eq: "h = ½gt²",
          desc: "自由落体运动的下落高度",
          vars: "g≈9.8m/s², 初速度为0"
        },
        {
          cat: "kinematics",
          name: "平抛运动",
          eq: "x=v₀t, y=½gt²",
          desc: "水平方向匀速，竖直方向自由落体",
          vars: "v₀:水平初速度"
        },
        {
          cat: "kinematics",
          name: "向心加速度",
          eq: "a = v²/r = ω²r",
          desc: "圆周运动的向心加速度",
          vars: "v:线速度, ω:角速度, r:半径"
        },
        {
          cat: "kinematics",
          name: "向心力",
          eq: "F = mv²/r = mω²r",
          desc: "圆周运动所需的向心力",
          vars: "使物体做圆周运动的合外力"
        },
        {
          cat: "kinematics",
          name: "周期与频率",
          eq: "T = 2π/ω = 1/f",
          desc: "周期、角速度、频率的关系",
          vars: "T:周期(s), f:频率(Hz), ω:角速度(rad/s)"
        },

        // 功与能
        {
          cat: "energy",
          name: "功",
          eq: "W = Fs·cosθ",
          desc: "功等于力乘位移乘力与位移夹角的余弦",
          vars: "θ:力与位移的夹角"
        },
        {
          cat: "energy",
          name: "功率",
          eq: "P = W/t = Fv",
          desc: "功率等于功除以时间，或力乘速度",
          vars: "P:功率(W), W:功(J)"
        },
        {
          cat: "energy",
          name: "动能",
          eq: "Eₖ = ½mv²",
          desc: "物体因运动而具有的能量",
          vars: "m:质量(kg), v:速度(m/s)"
        },
        {
          cat: "energy",
          name: "重力势能",
          eq: "Eₚ = mgh",
          desc: "物体因位置而具有的重力势能",
          vars: "h:相对参考面的高度"
        },
        {
          cat: "energy",
          name: "弹性势能",

        waves: "波动与光",

        modern: "近代物理"
      };

      let currentCategory = "all";

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          currentCategory = tab.dataset.cat;
          renderFormulas();
        });
      });

      function renderFormulas(filter = "") {
        const container = document.getElementById("formulaList");
        container.textContent = "";

        const filteredFormulas = formulas.filter((f) => {
          const catMatch = currentCategory === "all" || f.cat === currentCategory;
          const searchMatch =
            !filter ||
            f.name.toLowerCase().includes(filter.toLowerCase()) ||
            f.desc.toLowerCase().includes(filter.toLowerCase()) ||
            f.eq.toLowerCase().includes(filter.toLowerCase());
          return catMatch && searchMatch;
        });

        // Group by category
        const grouped = {};
        filteredFormulas.forEach((f) => {
          if (!grouped[f.cat]) grouped[f.cat] = [];
          grouped[f.cat].push(f);
        });

        Object.keys(grouped).forEach((cat) => {
          const section = document.createElement("div");
          section.className = "category-section";

          if (currentCategory === "all") {
            const card = document.createElement("div");
            card.className = "card";

            const title = document.createElement("div");
            title.className = "card-title";
            title.textContent = categoryNames[cat];
            card.appendChild(title);

            const grid = document.createElement("div");
            grid.className = "formula-grid";

            grouped[cat].forEach((f) => {
              grid.appendChild(createFormulaItem(f, filter));
            });

            card.appendChild(grid);
            section.appendChild(card);
          } else {
            const grid = document.createElement("div");
            grid.className = "card";

            const innerGrid = document.createElement("div");
            innerGrid.className = "formula-grid";

            grouped[cat].forEach((f) => {
              innerGrid.appendChild(createFormulaItem(f, filter));
            });

            grid.appendChild(innerGrid);
            section.appendChild(grid);
          }

          container.appendChild(section);
        });

        if (filteredFormulas.length === 0) {
          const empty = document.createElement("div");
          empty.className = "card";
          empty.style.textAlign = "center";
          empty.style.color = "var(--text-secondary)";
          empty.textContent = "未找到匹配的公式";
          container.appendChild(empty);
        }
      }

      function createFormulaItem(f, filter) {
        const item = document.createElement("div");
        item.className = "formula-item";

        const name = document.createElement("div");
        name.className = "formula-name";
        name.textContent = f.name;

        const eq = document.createElement("div");
        eq.className = "formula-eq";
        eq.textContent = f.eq;

        const desc = document.createElement("div");
        desc.className = "formula-desc";
        desc.textContent = f.desc;

        const vars = document.createElement("div");
        vars.className = "formula-vars";
        vars.textContent = f.vars;

        item.appendChild(name);
        item.appendChild(eq);
        item.appendChild(desc);
        item.appendChild(vars);

        return item;
      }

      function searchFormulas(query) {
        renderFormulas(query);
      }

      renderFormulas();

      // Theme toggle
      function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        html.setAttribute("data-theme", newTheme);
        document.getElementById("theme-icon").textContent = newTheme === "light" ? "☀️" : "🌙";
        localStorage.setItem("theme", newTheme);
      }

      // Load saved theme
      const savedTheme = localStorage.getItem("theme") || "dark";
      if (savedTheme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
        document.getElementById("theme-icon").textContent = "☀️";
      }
