name: Update AI PriceHub Data

on:
  schedule:
    # 每天 UTC 16:00（北京时间次日 00:00）自动更新
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest data
        run: python _gen_aiprice_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/aiprice/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update AI PriceHub data [skip ci]"
            git push
          fi
