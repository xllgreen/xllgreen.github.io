name: Update website changelog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate update log
        run: python _gen_update_log.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/update-log.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update website update log [skip ci]"
            git push
          fi
