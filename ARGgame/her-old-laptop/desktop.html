  <script src="assets/js/common.js"></script>
  <script>
    Game.mark('BOOT');
    Game.renderProgress();
    // 进入桌面后第一条内心独白（仅首次进入显示）
    if (!sessionStorage.getItem('lw_desktop_first_seen')) {
      sessionStorage.setItem('lw_desktop_first_seen', '1');
      setTimeout(() => Game.monologue('她的电脑还热着 像是刚被人用过', 5000), 1200);
    }
  </script>
