<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#c5e1f7"/>
    </linearGradient>
    <radialGradient id="dial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6fb6ec"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </radialGradient>
    <radialGradient id="needleRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c62828"/>
    </radialGradient>
    <filter id="sds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#sbg)" filter="url(#sds)"/>
  <!-- Compass dial -->
  <circle cx="64" cy="64" r="44" fill="url(#dial)"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <!-- Outer ring highlight -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- Tick marks -->
  <g stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round">
    <line x1="64" y1="22" x2="64" y2="28"/>
    <line x1="64" y1="100" x2="64" y2="106"/>
    <line x1="22" y1="64" x2="28" y2="64"/>
    <line x1="100" y1="64" x2="106" y2="64"/>
    <line x1="34" y1="34" x2="38" y2="38"/>
    <line x1="94" y1="94" x2="98" y2="98"/>
    <line x1="94" y1="34" x2="98" y2="38"/>
    <line x1="34" y1="94" x2="38" y2="98"/>
  </g>
  <!-- Compass needle (rotated for a pleasing angle) -->
  <g transform="rotate(-30 64 64)">
    <!-- White pointer (south) -->
    <path d="M64 64 L72 98 L64 92 Z" fill="#f5f5f5"/>
    <path d="M64 64 L56 98 L64 92 Z" fill="#e0e0e0"/>
    <!-- Red pointer (north) -->
    <path d="M64 64 L72 30 L64 36 Z" fill="url(#needleRed)"/>
    <path d="M64 64 L56 30 L64 36 Z" fill="#b71c1c"/>
  </g>
  <!-- Center hub -->
  <circle cx="64" cy="64" r="6" fill="#fff"/>
  <circle cx="64" cy="64" r="4" fill="#90a4ae"/>
  <!-- North indicator dot -->
  <circle cx="64" cy="22" r="3" fill="#ff5252"/>
</svg>
