<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#45e57b"/>
      <stop offset="50%" stop-color="#2cc96a"/>
      <stop offset="100%" stop-color="#1a9e55"/>
    </linearGradient>
    <filter id="wds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#wbg)" filter="url(#wds)"/>
  <!-- Large chat bubble -->
  <g transform="translate(64, 58)">
    <ellipse cx="0" cy="-4" rx="38" ry="28" fill="#fff"/>
    <ellipse cx="0" cy="-4" rx="38" ry="28" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <path d="M-16 18 Q-22 26 -28 22 L-20 14 Z" fill="#fff"/>
    <path d="M-16 18 Q-22 26 -28 22 L-20 14 Z" fill="#fff" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <!-- Small dots for eyes -->
    <circle cx="-14" cy="-6" r="3.5" fill="#3da869"/>
    <circle cx="14" cy="-6" r="3.5" fill="#3da869"/>
  </g>
  <!-- Secondary smaller bubble overlapping -->
  <g transform="translate(88, 96)">
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="#e8e8e8"/>
    <path d="M-8 10 Q-12 14 -16 12 L-10 6 Z" fill="#e8e8e8"/>
    <circle cx="-5" cy="-2" r="2" fill="#3da869"/>
