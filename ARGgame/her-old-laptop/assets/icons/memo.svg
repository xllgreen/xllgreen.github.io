<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="35%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ffd24d"/>
    </linearGradient>
    <linearGradient id="nTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="100%" stop-color="#ffd866"/>
    </linearGradient>
    <linearGradient id="nSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#ffb82e"/>
    </linearGradient>
    <filter id="nds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Base squircle -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#nbg)" filter="url(#nds)"/>
  <!-- Top folded corner / spine -->
  <rect x="6" y="6" width="116" height="28" rx="26" fill="url(#nTop)"/>
  <rect x="6" y="20" width="116" height="14" fill="url(#nSide)"/>
  <!-- Ruled paper lines -->
  <g stroke="#d4a840" stroke-width="1.8" stroke-linecap="round" opacity="0.35">
    <line x1="24" y1="54" x2="104" y2="54"/>
    <line x1="24" y1="70" x2="104" y2="70"/>
    <line x1="24" y1="86" x2="96" y2="86"/>
    <line x1="24" y1="102" x2="100" y2="102"/>
  </g>
  <!-- Red margin line -->
  <line x1="20" y1="46" x2="20" y2="112" stroke="#e06060" stroke-width="1.2" opacity="0.35"/>
  <!-- Small fold at bottom-right corner -->
  <path d="M96 112 L116 112 L116 100 Q112 104 108 108 Q102 110 96 112 Z" fill="#ffb82e" opacity="0.6"/>
</svg>
