<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c8cc"/>
      <stop offset="100%" stop-color="#8e8e93"/>
    </linearGradient>
    <linearGradient id="hiCircle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <filter id="hds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#hbg)" filter="url(#hds)"/>
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
  <!-- Inner gradient circle -->
  <circle cx="64" cy="64" r="34" fill="url(#hiCircle)"/>
  <!-- Question mark -->
  <text x="64" y="80" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="50" font-weight="500" fill="#8e8e93" text-anchor="middle">?</text>
  <!-- Small dot at bottom -->
  <circle cx="64" cy="100" r="3" fill="rgba(255,255,255,0.8)"/>
</svg>
