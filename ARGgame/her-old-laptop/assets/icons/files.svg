<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ec4f8"/>
      <stop offset="100%" stop-color="#2196e8"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e7fd6"/>
      <stop offset="100%" stop-color="#1864b0"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3da3e8"/>
      <stop offset="100%" stop-color="#1e88e0"/>
    </linearGradient>
    <filter id="fds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Squircle background -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#fbg)" filter="url(#fds)"/>
  <!-- Finder face: split left darker, right lighter -->
  <!-- Left half (darker blue) -->
  <path d="M64 18 Q40 22 28 42 L28 90 Q36 108 64 112 Z" fill="url(#fLeft)"/>
  <!-- Right half (lighter blue) -->
  <path d="M64 18 Q88 22 100 42 L100 90 Q92 108 64 112 Z" fill="url(#fRight)"/>
  <!-- Center dividing line (subtle smile) -->
  <path d="M64 28 Q64 56 64 80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Left eye (half circle darker) -->
  <path d="M48 50 Q52 46 56 50 Q56 56 52 56 Q48 56 48 50 Z" fill="#0d47a1" opacity="0.6"/>
  <!-- Right eye (half circle lighter) -->
  <path d="M72 50 Q68 46 64 50 Q64 56 68 56 Q72 56 72 50 Z" fill="#1565c0" opacity="0.7"/>
  <!-- Eye whites -->
  <ellipse cx="52" cy="50" rx="5" ry="4" fill="#fff"/>
  <ellipse cx="68" cy="50" rx="5" ry="4" fill="#fff"/>
  <!-- Pupils -->
  <circle cx="53" cy="51" r="2.5" fill="#1a237e"/>
  <circle cx="67" cy="51" r="2.5" fill="#1a237e"/>
  <!-- Smile / mouth arc -->
  <path d="M50 78 Q64 88 78 78" fill="none" stroke="#0d47a1" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
