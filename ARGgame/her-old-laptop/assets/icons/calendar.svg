<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f4"/>
    </linearGradient>
    <linearGradient id="chead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <filter id="cds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#cbg)" filter="url(#cds)"/>
  <!-- Header bar with day abbreviation -->
  <rect x="6" y="6" width="116" height="32" rx="26" fill="url(#chead)"/>
  <rect x="6" y="22" width="116" height="16" fill="url(#chead)"/>
  <text x="64" y="28" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="2">FRI</text>
  <!-- Large date number -->
  <text x="64" y="96" font-family="-apple-system,'Helvetica Neue',sans-serif" font-size="74" font-weight="200" fill="#2c2c2c" text-anchor="middle" font-variant-numeric="tabular-nums">14</text>
</svg>
