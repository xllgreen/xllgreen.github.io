<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safari 浏览器</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* ===== 浏览器整体 ===== */
    .browser-chrome { display: flex; flex-direction: column; height: 100%; background: #f2f2f7; }
    .browser-toolbar { background: #f9f9fb; border-bottom: 1px solid #d1d1d6; padding: 6px 12px; flex-shrink: 0; }
    .browser-address-row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #d1d1d6; border-radius: 10px; padding: 0 12px; height: 36px; transition: all 0.2s; }
    .browser-address-row:focus-within { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
    .browser-address-row .nav-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .browser-address-row .nav-btn { width: 24px; height: 24px; border-radius: 4px; border: none; background: transparent; color: #888; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .browser-address-row .nav-btn:hover { background: #f0f0f0; }
    .browser-address-row input { flex: 1; border: none; outline: none; font-size: 14px; color: #1a1a1a; background: transparent; padding: 0 4px; }
    .browser-address-row input::placeholder { color: #bbb; }
    .browser-address-row .search-go { padding: 4px 14px; background: #007aff; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; flex-shrink: 0; }
    .browser-address-row .search-go:hover { background: #0056cc; }
    .address-relative { position: relative; flex: 1; }

    /* ===== 搜索历史下拉（百度风格） ===== */
    .search-history { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #d1d1d6; border-radius: 0 0 10px 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 50; margin-top: 2px; overflow: hidden; max-height: 560px; overflow-y: auto; }
    .search-history.visible { display: block; }
    .search-history .history-header { padding: 8px 14px; font-size: 11px; color: #888; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1; }
    .search-history .history-header .clear-all { color: #007aff; cursor: pointer; font-size: 11px; }

    /* 历史项 */
    .history-item { padding: 10px 14px; font-size: 13px; color: #333; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f8f8f8; transition: background 0.1s; user-select: none; }
    .history-item:hover { background: #f5f5f7; }
    .history-item .h-icon { color: #999; font-size: 14px; }
    .history-item .h-text { flex: 1; }
    .history-item .h-time { font-size: 11px; color: #bbb; margin-right: 8px; }
    .history-item .h-arrow { font-size: 10px; color: #ccc; transition: transform 0.2s; }
    .history-item.expanded .h-arrow { transform: rotate(90deg); }

    /* 展开内容：联想词 + 新闻链接 */
    .history-detail { display: none; background: #fafafa; border-bottom: 1px solid #eee; }
    .history-detail.visible { display: block; }
    .history-detail .detail-section { padding: 8px 0; }
    .history-detail .detail-label { padding: 4px 14px; font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

    /* 联想词列表 */
    .suggestion-row { padding: 8px 14px 8px 40px; font-size: 13px; color: #555; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.1s; }
    .suggestion-row:hover { background: #e8f4fd; color: #1a73e8; }
    .suggestion-row .s-icon { font-size: 12px; color: #999; }
    .suggestion-row .s-text mark { background: none; color: #d9707e; font-weight: 500; }

    /* 新闻/结果链接 */
    .result-row { padding: 10px 14px; border-top: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
    .result-row:hover { background: #f5f5f7; }
    .result-row .r-url { font-size: 11px; color: #2a7d2a; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
    .result-row .r-title { font-size: 14px; color: #1a0dab; font-weight: 500; margin-bottom: 3px; line-height: 1.3; }
    .result-row .r-title:hover { text-decoration: underline; }
    .result-row .r-snippet { font-size: 12px; color: #555; line-height: 1.5; }

    /* ===== 搜索结果页 ===== */
    .browser-content-area { flex: 1; overflow-y: auto; padding: 0; }
    .serp-page { max-width: 680px; margin: 0 auto; padding: 20px 24px; }
    .serp-page .serp-query { font-size: 13px; color: #888; margin-bottom: 16px; }
    .serp-page .serp-query strong { color: #333; }
    .serp-result { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
    .serp-result .result-url { font-size: 12px; color: #2a7d2a; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
    .serp-result .result-title { font-size: 16px; color: #1a0dab; font-weight: 500; cursor: pointer; margin-bottom: 4px; line-height: 1.4; }
    .serp-result .result-title:hover { text-decoration: underline; }
    .serp-result .result-snippet { font-size: 13px; color: #555; line-height: 1.6; }
    .serp-result .result-snippet .highlight { color: #d9707e; font-weight: 600; }
    .serp-result .result-note { font-size: 11px; color: #999; margin-top: 4px; font-style: italic; }
    .serp-empty { text-align: center; padding: 60px 20px; color: #999; }
    .serp-empty .icon { font-size: 48px; margin-bottom: 16px; }
    .serp-empty .suggestions { font-size: 12px; color: #bbb; margin-top: 12px; line-height: 1.8; }
    .serp-empty .suggestions span { color: #007aff; cursor: pointer; border-bottom: 1px dashed #007aff; }
    .serp-direct { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; font-size: 13px; color: #2e7d32; line-height: 1.6; }
    .serp-direct a { color: #1565c0; font-weight: 500; cursor: pointer; text-decoration: underline; }

    /* 新闻详情弹窗 */
    .news-detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .news-detail-overlay.visible { display: flex; }
    .news-detail-card { background: #fff; max-width: 600px; width: 100%; max-height: 80vh; border-radius: 12px; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: card-in 0.3s ease; }
    @keyframes card-in { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .news-detail-card .nd-header { padding: 24px 24px 16px; border-bottom: 1px solid #f0f0f0; }
    .news-detail-card .nd-header h2 { font-size: 18px; color: #1a1a1a; margin-bottom: 8px; line-height: 1.5; }
    .news-detail-card .nd-header .nd-meta { font-size: 12px; color: #999; display: flex; gap: 16px; }
    .news-detail-card .nd-body { padding: 20px 24px; font-size: 14px; line-height: 1.9; color: #444; }
    .news-detail-card .nd-body .highlight { background: #fff8e1; padding: 2px 6px; border-radius: 3px; color: #d9707e; font-weight: 500; }
    .news-detail-card .nd-close { display: block; width: 100%; padding: 14px; background: #f5f5f5; border: none; color: #666; font-size: 14px; cursor: pointer; border-radius: 0 0 12px 12px; }
    .news-detail-card .nd-close:hover { background: #eee; }
  </style>
</head>
<body>
  <div class="window">
    <div class="window-bar">
      <a class="back" href="/ARGgame/her-old-laptop/desktop.html">‹</a>
      <span class="title">Safari 浏览器</span>
    </div>
    <div class="window-body" style="padding:0;">
      <div class="browser-chrome">
        <div class="browser-toolbar">
          <div class="browser-address-row">
            <div class="nav-btns">
              <button class="nav-btn" title="后退">‹</button>
              <button class="nav-btn" title="前进">›</button>
            </div>
            <div class="address-relative">
              <input type="text" id="urlInput" placeholder="搜索或输入网址" autocomplete="off">
              <div class="search-history" id="searchHistory"></div>
            </div>
            <button class="search-go" onclick="doSearch()">搜索</button>
          </div>
        </div>
        <div class="browser-content-area" id="contentArea">
          <div class="serp-page" id="defaultPage">
            <div style="text-align:center;padding:60px 20px;color:#999;">
              <div style="font-size:48px;margin-bottom:16px;">🔍</div>
              <div style="font-size:15px;color:#666;">点击地址栏查看搜索历史，或输入关键词搜索</div>
            </div>
          </div>
          <div class="serp-page" id="serpPage" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="news-detail-overlay" id="newsOverlay">
    <div class="news-detail-card" id="newsCard"></div>
  </div>

  <script src="../assets/js/common.js"></script>
  <script>
    let config = null;

    fetch(Game.ROOT + 'assets/config/game-config.json')
      .then(r => r.json())
      .then(c => { config = c; initBrowser(); })
      .catch(() => { console.warn('配置加载失败'); config = getDefaultConfig(); initBrowser(); });

    function getDefaultConfig() {
      return { browser: { searchHistory: [], searchSuggestions: {}, searchResults: {}, directLinks: {} }, easterEgg: { title: '', content: { paragraphs: [], footer: '' } } };
    }

    function initBrowser() {
      buildSearchHistory();
      const urlInput = document.getElementById('urlInput');
      urlInput.addEventListener('focus', () => {
        document.getElementById('searchHistory').classList.add('visible');
      });
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doSearch();
        if (e.key === 'Escape') {
          document.getElementById('searchHistory').classList.remove('visible');
          urlInput.blur();
        }
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.address-relative')) {
          document.getElementById('searchHistory').classList.remove('visible');
        }
      });
    }

    // ===== 构建搜索历史（百度风格：点击展开 → 联想词 + 新闻链接） =====
    function buildSearchHistory() {
      const history = config.browser.searchHistory;
      const suggestions = config.browser.searchSuggestions || {};
      const container = document.getElementById('searchHistory');

      // 渐进式解锁：unlock 为空（日常向）或对应剧情 flag 已解锁才显示
      // 避免一开始就暴露主线，敏感记录随剧情推进"长出来"
      const visible = history.filter(h => {
        if (!h.unlock) return true;
        return Game.unlocked(h.unlock);
      });

      // 敏感条目首次出现时，注入"我"的内心独白
      const newlyShown = visible.filter(h => {
        if (!h.unlock) return false;
        const seenKey = 'lw_seen_search_' + h.text;
        if (!sessionStorage.getItem(seenKey)) {
          sessionStorage.setItem(seenKey, '1');
          return true;
        }
        return false;
      });
      if (newlyShown.length > 0) {
        Game.monologue('她后来开始查这些了……是在那之后吧。', 5500);
      }

      let html = `
        <div class="history-header">
          <span>搜索历史</span>
          <span class="clear-all" onclick="clearHistory()">清除</span>
        </div>
      `;

      if (visible.length === 0) {
        container.innerHTML = html + `<div style="padding:16px;text-align:center;color:#bbb;font-size:13px;">暂无搜索历史</div>`;
        return;
      }

      visible.forEach((h, idx) => {
        const suggs = suggestions[h.text] || [];
        const results = h.dropdownResults || [];

        html += `
          <div class="history-block" id="block-${idx}">
            <div class="history-item" onclick="toggleItem(${idx})">
              <span class="h-icon">🕐</span>
              <span class="h-text">${h.text}</span>
              <span class="h-time">${h.time}</span>
              <span class="h-arrow">▶</span>
            </div>
            <div class="history-detail" id="detail-${idx}">
              ${suggs.length > 0 ? `
                <div class="detail-section">
                  <div class="detail-label">大家还搜了</div>
                  ${suggs.map(s => `
                    <div class="suggestion-row" onclick="searchFromSuggestion('${s.replace(/'/g, "\\'")}')">
                      <span class="s-icon">🔍</span>
                      <span class="s-text">${highlightMatch(s, h.text)}</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
              ${results.length > 0 ? `
                <div class="detail-section">
                  <div class="detail-label">搜索结果</div>
                  ${results.map(r => `
                    <div class="result-row" onclick="searchFromSuggestion('${h.text}')">
                      <div class="r-url">🔗 ${r.url}</div>
                      <div class="r-title">${r.title}</div>
                      <div class="r-snippet">${r.snippet}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function highlightMatch(suggestion, keyword) {
      if (!keyword) return suggestion;
      const kw = keyword.trim();
      const idx = suggestion.toLowerCase().indexOf(kw.toLowerCase());
      if (idx === -1) return suggestion;
      return suggestion.substring(0, idx) + '<mark>' + suggestion.substring(idx, idx + kw.length) + '</mark>' + suggestion.substring(idx + kw.length);
    }

    function toggleItem(idx) {
      const item = document.querySelector(`#block-${idx} .history-item`);
      const detail = document.getElementById(`detail-${idx}`);
      const isExpanded = item.classList.contains('expanded');

      // 关闭其他
      document.querySelectorAll('.history-item.expanded').forEach(el => {
        if (el !== item) {
          el.classList.remove('expanded');
          el.nextElementSibling.classList.remove('visible');
        }
      });

      if (isExpanded) {
        item.classList.remove('expanded');
        detail.classList.remove('visible');
      } else {
        item.classList.add('expanded');
        detail.classList.add('visible');
      }
    }

    function clearHistory() {
      document.getElementById('searchHistory').innerHTML = `
        <div style="padding:16px;text-align:center;color:#bbb;font-size:13px;">搜索历史已清除</div>
      `;
    }

    function searchFromSuggestion(text) {
      document.getElementById('urlInput').value = text;
      document.getElementById('searchHistory').classList.remove('visible');
      doSearch();
    }

    // ===== 搜索执行 =====
    function doSearch() {
      const query = document.getElementById('urlInput').value.trim();
      document.getElementById('searchHistory').classList.remove('visible');
      if (!query) return;

      const defaultPage = document.getElementById('defaultPage');
      const serpPage = document.getElementById('serpPage');
      defaultPage.style.display = 'none';
      serpPage.style.display = 'block';

      Game.log('▶ [浏览器搜索] ' + query);
      Game.markRaw('lw_browser_searched');

      const ql = query.toLowerCase();

      // 直接跳转
      const directLinks = config.browser.directLinks || {};
      for (const [key, link] of Object.entries(directLinks)) {
        if (ql.includes(key)) {
          serpPage.innerHTML = `
            <div class="serp-query">搜索 "<strong>${query}</strong>" 的结果</div>
            <div class="serp-direct">📌 <a href="../${link.url}">${link.label}</a> — 点击直接进入</div>
            <div class="serp-result">
              <div class="result-url">🔗 bbs.xu.edu.cn</div>
              <div class="result-title" onclick="location.href='../${link.url}'">${link.label}</div>
              <div class="result-snippet">X大校内BBS，学术讨论区、校园生活、跳蚤市场等板块。仅供校内师生交流。</div>
            </div>
          `;
          return;
        }
      }

      // 搜索结果（命中多个时取最长 key，优先更具体的词，如"张航家属"不被"张航"截胡）
      const results = config.browser.searchResults || {};
      let matched = null, bestLen = -1;
      for (const [key, result] of Object.entries(results)) {
        if (ql.includes(key) || key.includes(ql)) {
          if (key.length > bestLen) { matched = result; bestLen = key.length; }
        }
      }

      if (!matched) {
        serpPage.innerHTML = `
          <div class="serp-query">搜索 "<strong>${query}</strong>" 的结果</div>
          <div class="serp-empty">
            <div class="icon">🔍</div>
            <div>没有找到与「${query}」相关的结果</div>
            <div class="suggestions">试试搜索：<span onclick="searchFromSuggestion('X大图书馆 开放时间')">X大图书馆</span> · <span onclick="searchFromSuggestion('X大物理系')">物理系</span> · <span onclick="searchFromSuggestion('简历模板 免费下载 word')">简历模板</span> · <span onclick="searchFromSuggestion('XX奶茶店 新品推荐')">奶茶店</span></div>
          </div>
        `;
        return;
      }

      if (matched.isEasterEgg) {
        const egg = config.easterEgg;
        serpPage.innerHTML = `
          <div class="serp-query">搜索 "<strong>${query}</strong>" 的结果</div>
          <div class="serp-result">
            <div class="result-url">🔍 特别收藏</div>
            <div class="result-title" onclick="showEasterEgg()">${egg.title}</div>
            <div class="result-snippet">学术诚信是科研的生命线。以下为近年国内外重大科研造假事件回顾。</div>
          </div>
        `;
        Game.mark('EASTEREGG');
        return;
      }

      serpPage.innerHTML = `
        <div class="serp-query">搜索 "<strong>${query}</strong>" 的结果（共约1条）</div>
        <div class="serp-result">
          <div class="result-url">🔗 ${matched.url || matched.source}</div>
          <div class="result-title" onclick="showNewsDetail('${query}')">${matched.title}</div>
          <div class="result-snippet">${matched.content}</div>
          ${matched.note ? `<div class="result-note">${matched.note}</div>` : ''}
          <div style="font-size:11px;color:#999;margin-top:4px;">${matched.date} · ${matched.source}</div>
        </div>
      `;
    }

    function showEasterEgg() {
      const egg = config.easterEgg;
      const overlay = document.getElementById('newsOverlay');
      const card = document.getElementById('newsCard');
      card.innerHTML = `
        <div class="nd-header">
          <h2>${egg.title}</h2>
          <div class="nd-meta">🔍 特别收藏 · 2024年</div>
        </div>
        <div class="nd-body">
          ${egg.content.paragraphs.map(p => `<p>${p}</p>`).join('')}
          <p style="color:#d9707e;text-align:center;margin-top:16px;">${egg.content.footer}</p>
        </div>
        <button class="nd-close" onclick="closeNews()">关闭</button>
      `;
      overlay.classList.add('visible');
    }

    function showNewsDetail(query) {
      const results = config.browser.searchResults || {};
      let matched = null, bestLen = -1;
      const ql2 = query.toLowerCase();
      for (const [key, result] of Object.entries(results)) {
        if (ql2.includes(key) || key.includes(ql2)) {
          if (key.length > bestLen) { matched = result; bestLen = key.length; }
        }
      }
      if (!matched) return;

      const overlay = document.getElementById('newsOverlay');
      const card = document.getElementById('newsCard');
      card.innerHTML = `
        <div class="nd-header">
          <h2>${matched.title}</h2>
          <div class="nd-meta">${matched.source} · ${matched.date}</div>
        </div>
        <div class="nd-body">
          <p>${matched.content}</p>
          ${matched.note ? `<p style="color:#999;font-size:12px;font-style:italic;">${matched.note}</p>` : ''}
        </div>
        <button class="nd-close" onclick="closeNews()">关闭</button>
      `;
      overlay.classList.add('visible');
    }

    function closeNews() {
      document.getElementById('newsOverlay').classList.remove('visible');
    }

    document.getElementById('newsOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('newsOverlay')) closeNews();
    });

    window.doSearch = doSearch;
    window.searchFromSuggestion = searchFromSuggestion;
    window.toggleItem = toggleItem;
    window.clearHistory = clearHistory;
    window.showNewsDetail = showNewsDetail;
    window.showEasterEgg = showEasterEgg;
    window.closeNews = closeNews;

    Game.renderProgress();
  </script>
</body>
</html>
