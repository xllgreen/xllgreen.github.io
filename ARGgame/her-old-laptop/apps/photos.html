<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
    }
    .photo {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #a8dadc, #457b9d);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s;
    }
    .photo:hover { transform: scale(1.02); }
    .photo::after {
      content: attr(data-date);
      position: absolute; left: 0; right: 0; bottom: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.55));
      color: #fff; font-size: 10px; padding: 12px 8px 5px;
      letter-spacing: 0.5px; opacity: 0.9;
    }
    .photo-meta {
      position: fixed; inset: 0; background: #000;
      display: none; flex-direction: column;
      z-index: 200;
    }
    .photo-meta .img-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #111; overflow: hidden;
    }
    .photo-meta .img-area img {
      max-width: 100%; max-height: 100%; object-fit: contain;
    }
    .photo-meta .meta-area {
      background: #1a1a1a; color: #ddd; padding: 16px 20px;
      font-size: 12px; line-height: 1.8; max-height: 42vh; overflow-y: auto;
    }
    .photo-meta .meta-area .exif-row { display: flex; gap: 12px; }
    .photo-meta .meta-area .exif-row span:first-child { color: #888; width: 100px; flex-shrink: 0; }
    .photo-meta .meta-area .exif-row span:last-child { color: #fff; flex: 1; word-break: break-all; }
    .photo-meta .meta-area .hidden-note {
      color: #95ec69; font-family: monospace;
      background: rgba(149,236,105,0.1); padding: 8px 10px;
      border-radius: 4px; margin-top: 12px;
    }
    .photo-meta .close-btn {
      position: absolute; top: 12px; right: 16px;
      color: #fff; font-size: 24px; cursor: pointer; z-index: 2;
    }
    .photo-meta .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      color: #fff; font-size: 32px; cursor: pointer;
      background: rgba(0,0,0,0.3); width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .photo-meta .nav-btn.prev { left: 12px; }
    .photo-meta .nav-btn.next { right: 12px; }
    .photo-meta .nav-btn:hover { background: rgba(0,0,0,0.6); }
  </style>
</head>
<body>
  <div class="window">
    <div class="window-bar">
      <a class="back" href="/ARGgame/her-old-laptop/desktop.html">‹</a>
      <span class="title">照片</span>
    </div>
    <div class="window-body">
      <div class="photo-grid" id="photoGrid"></div>
    </div>
  </div>

  <!-- 照片详情（模拟 EXIF 元数据查看器） -->
  <div class="photo-meta" id="meta">
    <div class="close-btn" onclick="hide()">×</div>
    <div class="nav-btn prev" onclick="nav(-1)">‹</div>
    <div class="nav-btn next" onclick="nav(1)">›</div>
    <div class="img-area"><img id="img-el" src="" alt=""></div>
    <div class="meta-area" id="meta-area"></div>
  </div>

  <script src="../assets/js/common.js"></script>
  <script>
    const photos = {
      1: { src: '../assets/images/photos/photo1_gate.jpg',     date: '2024-03-15', cam: 'iPhone 13', note: '校门口',                 loc: 'X大学 主校门' },
      2: { src: '../assets/images/photos/photo2_cherry.jpg',   date: '2024-03-22', cam: 'iPhone 13', note: '樱花开了',               loc: 'X大学 樱花大道' },
      3: { src: '../assets/images/photos/photo3_noodle.jpg',   date: '2024-04-01', cam: 'iPhone 13', note: '和周明吃拉面',           loc: '北门 一蘭拉面' },
      4: { src: '../assets/images/photos/photo4_library.jpg', date: '2024-04-18', cam: 'iPhone 13', note: '图书馆熬夜',             loc: 'X大图书馆 三楼自习区' },
      // 第5张：毕业照，EXIF 备注里藏年份 LW??24（微信密码线索，部分遮挡需玩家拼接）
      5: {
        src: '../assets/images/photos/photo5_graduation.jpg', date: '2024-05-10', cam: 'iPhone 13',
        note: '毕业照拍了 证还没发', loc: 'X大学 主楼',
        exif: {
          '设备': 'iPhone 13',
          '时间': '2024-05-10 14:23:11',
          '地点': 'X大学 主楼',
          '尺寸': '4032×3024',
          '备注 (UserComment)': 'LW??24  // 永远别忘了'
        }
      },
      6: { src: '../assets/images/photos/photo6_hike.jpg',     date: '2024-05-15', cam: 'iPhone 13', note: '远足',                   loc: '西山 龙脊步道' },
      7: { src: '../assets/images/photos/photo7_coffee.jpg',  date: '2024-05-17', cam: 'iPhone 13', note: '写论文的咖啡',           loc: '校内 拾光咖啡' },
      8: { src: '../assets/images/photos/photo8_cat.jpg',      date: '2024-05-19', cam: 'iPhone 13', note: '楼下小橘',               loc: '研究生公寓 A 栋楼下' },
      9: { src: '../assets/images/photos/photo9_sunset.jpg',   date: '2024-05-20', cam: 'iPhone 13', note: '最后一张',               loc: '物理楼 实验室窗' }
    };

    let currentId = 1;
    const ids = Object.keys(photos).map(Number).sort((a,b)=>a-b);

    // 渲染网格
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = ids.map(id => {
      const p = photos[id];
      return `<div class="photo" data-id="${id}" data-date="${p.date}"
                style="background-image:url('${p.src}');"
                onclick="show(${id})"></div>`;
    }).join('');

    function show(id) {
      currentId = id;
      Game.log('▶ [相册] 查看照片 #' + id);
      const p = photos[id];
      document.getElementById('img-el').src = p.src;

      let html = '';
      html += `<div class="exif-row"><span>拍摄日期</span><span>${p.date}</span></div>`;
      html += `<div class="exif-row"><span>设备</span><span>${p.cam}</span></div>`;
      html += `<div class="exif-row"><span>地点</span><span>${p.loc}</span></div>`;
      html += `<div class="exif-row"><span>备注</span><span>${p.note}</span></div>`;

      if (p.exif) {
        Game.log('  └ 该照片含完整 EXIF 信息');
        html += `<div style="margin-top:16px;padding-top:12px;border-top:1px solid #333;color:#888;font-size:11px;">完整 EXIF 信息</div>`;
        Object.entries(p.exif).forEach(([k, v]) => {
          const isHidden = k.includes('UserComment');
          if (isHidden) {
            Game.log('  └ ★ 关键线索已暴露: ' + k + ' = ' + v);
          }
          html += `<div class="exif-row"><span>${k}</span><span style="${isHidden ? 'color:#95ec69;font-family:monospace;' : ''}">${v}</span></div>`;
        });
        Game.toast('发现可疑备注');
        Game.markRaw('lw_photo_exif_seen');
      }

      document.getElementById('meta-area').innerHTML = html;
      document.getElementById('meta').style.display = 'flex';
    }

    function nav(dir) {
      const idx = ids.indexOf(currentId);
      const next = (idx + dir + ids.length) % ids.length;
      show(ids[next]);
    }

    function hide() {
      document.getElementById('meta').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('meta').style.display !== 'flex') return;
      if (e.key === 'Escape') hide();
      else if (e.key === 'ArrowLeft') nav(-1);
      else if (e.key === 'ArrowRight') nav(1);
    });

    document.getElementById('meta').addEventListener('click', (e) => {
      if (e.target.id === 'meta') hide();
    });

    window.show = show;
    window.hide = hide;
    window.nav = nav;

    Game.renderProgress();
  </script>
</body>
</html>
