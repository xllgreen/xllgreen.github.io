<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信登录</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="window">
    <div class="window-bar">
      <a class="back" href="/ARGgame/her-old-laptop/desktop.html">‹</a>
      <span class="title">微信</span>
    </div>
    <div class="window-body">
      <div class="login-page">
        <div class="login-logo" style="background:linear-gradient(135deg,#07c160,#05a347);"></div>
        <div class="login-title">微信登录</div>
        <div class="login-sub">账号：林晚 (linwan_2024)<br>请输入密码</div>

        <div class="login-form">
          <input type="password" class="login-input" id="pwd"
                 placeholder="密码" maxlength="20" autocomplete="off">
          <button class="login-btn" id="btn">登 录</button>
          <div class="login-err" id="err"></div>
        </div>

        <div class="login-tip">
          提示：密码 = 备忘录里那个"老规矩"
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/common.js"></script>
  <script>
    function submit() {
      const v = document.getElementById('pwd').value;
      Game.log('▶ 进入微信登录校验流程');
      Game.verify(v, 'wechat', '微信登录', () => {
        Game.mark('WECHAT_LOGIN');
        Game.toast('登录成功');
        setTimeout(() => location.href = '/ARGgame/her-old-laptop/apps/wechat.html', 600);
      }, (failN) => {
        if (failN === 3) Game.monologue('备忘录第四条：「L + W + 4位数字」。相册第5张的备注里好像也有个 LW??24。', 5500);
        document.getElementById('err').textContent = failN >= 3
          ? '密码错误（已错 ' + failN + ' 次）'
          : '密码错误';
        document.getElementById('pwd').value = '';
      });
    }
    document.getElementById('btn').addEventListener('click', submit);
    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') submit();
    });
    Game.renderProgress();
  </script>
</body>
</html>
