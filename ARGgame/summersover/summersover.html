<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>夜航</title>
  <script type="module" crossorigin src="/ARGgame/summersover/assets/modulepreload-polyfill.B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/ARGgame/summersover/assets/404.C0jFuYTi.js"></script>
  <link rel="stylesheet" crossorigin href="/ARGgame/summersover/assets/404.DYC5aGxI.css">
</head>
<body>

<div id="stage" class="hidden">
  <div id="message-area">
    <p id="main-msg">夜航</p>
    <p id="sub" style="font-size:13px;color:#4A6A7A;margin-top:8px;">第 三 航 次</p>
    <div id="sub-msg" class="hidden"></div>
  </div>

  <button id="confirm-btn" class="hidden">确定</button>

  <div id="entry-link" class="hidden" style="margin-top:48px;font-size:12px;color:rgba(90,120,140,0.25);letter-spacing:1px;">
    <a href="/ARGgame/summersover/board/deepspace" style="color:rgba(90,120,140,0.3);text-decoration:none;">→ 进入夜航论坛 ←</a>
  </div>
</div>

<div id="page-counter">404</div>

<script>
(function() {
  var path = window.location.pathname.replace(/\/+$/, '')
  var isRoot = path === '' || path === '/ARGgame/summersover' || path === '/ARGgame/summersover/summersover.html'

  if (isRoot) {
    // 根路径 → 跳转深空版块
    window.location.replace('/ARGgame/summersover/board/deepspace')
  } else {
    // 不存在的路径 → 显示 404 彩蛋
    document.getElementById('stage').classList.remove('hidden')
    document.getElementById('confirm-btn').classList.remove('hidden')
    document.getElementById('entry-link').classList.remove('hidden')
  }
})()
</script>

</body>
</html>
