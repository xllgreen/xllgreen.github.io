<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>雾落村·槐香引</title>
<style>
/* ========== 全局重置与基础 ========== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#1e2a35;--bg-mid:#283744;--bg-soft:#324554;
  --fog:rgba(190,205,220,0.18);
  --text:#d8d0c4;--text-dim:#9a9488;--text-bright:#ede5d5;
  --amber:#c4a062;--amber-soft:#d4b87a;--amber-glow:rgba(196,160,98,0.3);
  --danger:#a05050;--warm:#c9885a;--green-soft:#6a8a6a;
  --border:rgba(196,160,98,0.2);
  --card-bg:rgba(40,55,68,0.85);
  --serif:'Georgia','Noto Serif SC','Source Han Serif SC',serif;
  --sans:'Helvetica Neue','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:var(--sans);color:var(--text);user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit}
input{font-family:inherit;outline:none}

/* ========== 雾效层 ========== */
.fog-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fog-layer::before,.fog-layer::after{content:'';position:absolute;width:200%;height:200%;background:radial-gradient(ellipse at 30% 40%,var(--fog) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,var(--fog) 0%,transparent 50%);animation:fogDrift 40s linear infinite}
.fog-layer::after{animation-duration:60s;animation-direction:reverse;opacity:0.7}
.fog-layer .fog-extra{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 80%,rgba(200,210,220,0.12) 0%,transparent 60%),radial-gradient(ellipse 50% 35% at 20% 30%,rgba(180,195,210,0.1) 0%,transparent 50%);animation:fogDrift2 50s ease-in-out infinite}
@keyframes fogDrift{0%{transform:translate(-25%,-25%)}100%{transform:translate(-10%,-15%)}}
@keyframes fogDrift2{0%,100%{opacity:0.8;transform:translateX(0)}50%{opacity:1;transform:translateX(2%)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 50%,rgba(10,15,20,0.5) 100%)}

/* ========== 主容器 ========== */
#game{position:relative;width:100%;height:100vh;max-width:860px;margin:0 auto;z-index:2;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px}

/* ========== 场景通用 ========== */
.scene{width:100%;max-width:760px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(10px);transition:opacity 0.8s,transform 0.8s;overflow-y:auto;padding-bottom:80px}
.scene.active{opacity:1;transform:translateY(0)}
.scene::-webkit-scrollbar{width:4px}
.scene::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.act-tag{font-size:13px;color:var(--amber);letter-spacing:6px;margin-bottom:4px;text-transform:uppercase}
.scene-title{font-family:var(--serif);font-size:26px;color:var(--text-bright);margin-bottom:10px;text-align:center;letter-spacing:2px}

/* ========== 场景图片 ========== */
.scene-img-wrap{width:100%;max-width:620px;border-radius:10px;overflow:hidden;margin:0 auto 12px;position:relative;border:1px solid var(--border);flex-shrink:0;background:rgba(20,28,36,0.5)}
.scene-img{display:block;margin:0 auto;border-radius:10px;max-width:100%;max-height:300px;width:auto;height:auto;object-fit:contain;object-position:center;transition:opacity 0.6s}
.scene-img-caption{position:absolute;bottom:0;left:0;right:0;padding:8px 14px;background:linear-gradient(transparent,rgba(0,0,0,0.75));font-size:12px;color:var(--text-dim);letter-spacing:1px;text-align:center}

.narrative{font-family:var(--serif);font-size:17px;line-height:2.0;color:var(--text);text-align:justify;width:100%;max-width:620px;margin-top:4px}
.narrative p{margin-bottom:12px;opacity:0;animation:textFade 0.6s forwards}
.narrative p:nth-child(1){animation-delay:0.4s}
.narrative p:nth-child(2){animation-delay:1.2s}
.narrative p:nth-child(3){animation-delay:2.0s}
.narrative p:nth-child(4){animation-delay:2.8s}
.narrative p:nth-child(5){animation-delay:3.6s}
.narrative p:nth-child(6){animation-delay:4.4s}
.narrative p:nth-child(7){animation-delay:5.2s}
.narrative p:nth-child(8){animation-delay:6.0s}
.narrative p:nth-child(9){animation-delay:6.8s}
@keyframes textFade{to{opacity:1}}
.narrative .em{color:var(--amber-soft)}
.narrative .danger{color:var(--danger)}
.narrative .warm{color:var(--warm)}
.narrative .ghost{color:#7a8a9a;font-style:italic}

/* ========== 按钮 ========== */
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.btn{padding:10px 28px;font-size:15px;color:var(--amber);border:1px solid var(--amber);border-radius:4px;background:rgba(196,160,98,0.05);transition:all 0.3s;letter-spacing:1px;white-space:nowrap}
.btn:hover{background:rgba(196,160,98,0.15);color:var(--text-bright)}
.btn.sm{font-size:13px;padding:6px 16px}
.btn.warm{color:var(--warm);border-color:var(--warm)}
.btn.warm:hover{background:rgba(201,136,90,0.15)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:rgba(160,80,80,0.15)}
.btn:disabled{opacity:0.3;cursor:not-allowed}

/* ========== 封面 ========== */
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.cover-bg{position:absolute;inset:0;background:linear-gradient(180deg,#0f1820 0%,#1a2530 40%,#1e2a35 70%,#152028 100%);opacity:0.4;transition:opacity 0.5s}
.cover-img-wrap{position:absolute;inset:0;overflow:hidden}
.cover-img-wrap img{width:100%;height:100%;object-fit:cover;opacity:0.55;filter:blur(0.5px) brightness(0.8)}
.cover-title-wrap{position:relative;z-index:2;text-align:center}
.cover-sub{font-size:13px;color:var(--amber-soft);letter-spacing:8px;margin-bottom:16px;opacity:0;animation:textFade 1.2s forwards;animation-delay:0.3s}
.cover-title{font-family:var(--serif);font-size:52px;color:var(--text-bright);letter-spacing:10px;text-shadow:0 0 40px rgba(196,160,98,0.4),0 4px 20px rgba(0,0,0,0.6);margin-bottom:6px;opacity:0;animation:textFade 1.5s forwards;animation-delay:0.6s}
.cover-subtitle{font-size:14px;color:var(--amber);letter-spacing:4px;margin-bottom:40px;opacity:0;animation:textFade 1.2s forwards;animation-delay:1.2s}
.cover-btn{padding:14px 48px;font-size:17px;color:var(--amber);border:1px solid var(--amber);border-radius:4px;background:rgba(196,160,98,0.08);letter-spacing:4px;transition:all 0.4s;opacity:0;animation:textFade 1s forwards;animation-delay:1.5s}
.cover-btn:hover{background:rgba(196,160,98,0.2);color:var(--text-bright);box-shadow:0 0 20px var(--amber-glow)}
.cover-credit{position:absolute;bottom:24px;font-size:12px;color:var(--text-dim);letter-spacing:2px;opacity:0;animation:textFade 1s forwards;animation-delay:2.5s}

/* ========== 进度条 ========== */
#progress-bar{position:fixed;top:0;left:0;height:2px;background:var(--amber);z-index:100;transition:width 0.6s;width:0%}
#act-indicator{position:fixed;top:10px;right:16px;font-size:12px;color:var(--text-dim);z-index:100;letter-spacing:2px}

/* ========== 谜题：物品搜索 ========== */
.room-view{width:100%;max-width:580px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px;margin:12px 0}
.room-desc{font-family:var(--serif);font-size:15px;color:var(--text-dim);text-align:center;margin-bottom:14px;line-height:1.8}
.items-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.item-slot{aspect-ratio:1;background:rgba(50,69,84,0.6);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:all 0.3s;position:relative}
.item-slot:hover{background:rgba(196,160,98,0.1);border-color:var(--amber)}
.item-slot.found{background:rgba(106,138,106,0.15);border-color:var(--green-soft)}
.item-slot.found::after{content:'✓';position:absolute;top:4px;right:6px;font-size:12px;color:var(--green-soft)}
.puzzle-feedback{font-size:14px;text-align:center;margin:8px 0;min-height:20px;transition:opacity 0.3s}

/* ========== 谜题：物品详情弹窗 ========== */
.item-modal{position:fixed;inset:0;z-index:300;background:rgba(10,15,20,0.85);display:none;align-items:center;justify-content:center;padding:20px}
.item-modal.show{display:flex}
.item-modal-content{max-width:420px;width:100%;background:var(--card-bg);border:1px solid var(--amber);border-radius:12px;padding:24px;text-align:center}
.item-modal-icon{font-size:48px;margin-bottom:12px}
.item-modal-title{font-family:var(--serif);font-size:20px;color:var(--text-bright);margin-bottom:10px}
.item-modal-desc{font-size:15px;color:var(--text-dim);line-height:1.8;margin-bottom:16px}
.item-modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ========== 谜题：步骤进度 ========== */
.puzzle-steps{display:flex;gap:6px;justify-content:center;margin:10px 0 14px}
.puzzle-step{width:28px;height:4px;border-radius:2px;background:var(--border);transition:all 0.3s}
.puzzle-step.done{background:var(--amber)}
.puzzle-step.current{background:var(--amber-soft);box-shadow:0 0 8px var(--amber-glow)}

/* ========== 谜题：方向旋转 ========== */
.twist-puzzle{text-align:center;margin:16px 0}
.twist-dial{width:120px;height:120px;border-radius:50%;border:3px solid var(--border);margin:0 auto 12px;position:relative;background:radial-gradient(circle,rgba(50,69,84,0.8),rgba(30,42,53,0.9));cursor:pointer;transition:transform 0.3s}
.twist-pointer{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid var(--amber)}
.twist-arrow{position:absolute;font-size:20px;color:var(--text-dim);transition:all 0.3s}
.twist-arrow.active{color:var(--amber);transform:scale(1.2)}
.twist-label{font-size:13px;color:var(--text-dim);margin-top:6px}

/* ========== 谜题：暗号翻译 ========== */
.cipher-area{max-width:480px;margin:12px auto}
.cipher-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;justify-content:center}
.cipher-cell{width:40px;height:40px;border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--amber);font-family:var(--serif);background:rgba(50,69,84,0.4)}
.cipher-input{width:40px;height:40px;text-align:center;font-size:18px;color:var(--text-bright);background:rgba(50,69,84,0.6);border:1px solid var(--border);border-radius:6px;font-family:var(--serif)}
.cipher-input:focus{border-color:var(--amber)}
.cipher-arrow{color:var(--text-dim);font-size:14px}

/* ========== 谜题：密码输入 ========== */
.code-display{display:flex;gap:10px;justify-content:center;margin:16px 0}
.code-box{width:40px;height:48px;border:2px solid var(--border);border-radius:6px;background:rgba(50,69,84,0.6);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-bright);font-family:var(--serif);transition:all 0.3s}
.code-box.filled{border-color:var(--amber)}
.code-box.error{border-color:var(--danger);animation:shake 0.4s}
.code-box.ok{border-color:var(--green-soft)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:16px auto 0}
.numpad button{aspect-ratio:1.4;font-size:20px;color:var(--text);background:rgba(50,69,84,0.6);border:1px solid var(--border);border-radius:8px;transition:all 0.2s}
.numpad button:hover{background:rgba(196,160,98,0.15);color:var(--amber-soft)}

/* ========== 谜题：石阵 ========== */
.stone-array{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px;margin:16px auto}
.stone{aspect-ratio:1;background:radial-gradient(circle at 40% 35%,#4a5a6a,#2a3a4a);border-radius:50% 50% 45% 55%;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-dim);position:relative;border:2px solid transparent}
.stone:hover{border-color:var(--amber);transform:scale(1.05)}
.stone.selected{border-color:var(--amber);background:radial-gradient(circle at 40% 35%,#5a6a7a,#3a4a5a);color:var(--amber)}
.stone.selected .stone-num{display:block}
.stone-num{display:none;position:absolute;font-size:14px;color:var(--amber);font-weight:bold}
.stone.wrong{border-color:var(--danger);animation:shake 0.4s}
.stone-correct{border-color:var(--green-soft)!important}

/* ========== 谜题：刻痕 ========== */
.carving-area{display:flex;gap:20px;justify-content:center;margin:20px 0}
.carving{width:80px;height:100px;background:rgba(60,50,40,0.6);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.carving:hover{border-color:var(--amber);background:rgba(196,160,98,0.1)}
.carving.touched{border-color:var(--amber);background:rgba(196,160,98,0.15)}
.carving .icon{font-size:28px}
.carving .label{font-size:12px;color:var(--text-dim)}
.carving .order{font-size:16px;color:var(--amber);font-weight:bold;margin-top:4px}

/* ========== 谜题：档案排列 ========== */
.doc-slot{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(50,69,84,0.3);border:1px dashed var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;min-height:44px}
.doc-slot:hover{border-color:var(--amber);background:rgba(196,160,98,0.05)}
.doc-slot.filled{border-style:solid;border-color:var(--green-soft);background:rgba(106,138,106,0.08);cursor:default}
.doc-slot .slot-num{font-size:14px;color:var(--amber);font-weight:bold;min-width:20px}
.doc-slot .slot-content{font-size:13px;color:var(--text-dim);flex:1}
.doc-card{padding:8px 12px;background:rgba(50,69,84,0.6);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;text-align:center;min-width:90px}
.doc-card:hover{border-color:var(--amber);background:rgba(196,160,98,0.1)}
.doc-card.selected{border-color:var(--amber);background:rgba(196,160,98,0.15);box-shadow:0 0 12px var(--amber-glow)}
.doc-card-year{font-size:13px;color:var(--amber);font-weight:bold;margin-bottom:2px}
.doc-card-title{font-size:12px;color:var(--text-dim)}

/* ========== 谜题：亡魂问答 ========== */
.spirit-question{padding:16px 20px;background:rgba(40,50,60,0.7);border:1px solid var(--border);border-radius:10px;margin:12px 0;font-family:var(--serif);font-size:16px;color:var(--text-bright);line-height:1.8;text-align:center}
.spirit-name{font-size:13px;color:var(--amber-soft);margin-bottom:8px;letter-spacing:2px}
.spirit-options{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:12px auto}
.spirit-option{padding:12px 16px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;font-size:14px;color:var(--text);line-height:1.6}
.spirit-option:hover{border-color:var(--amber);background:rgba(196,160,98,0.1)}
.spirit-option.correct{border-color:var(--green-soft);background:rgba(106,138,106,0.15)}
.spirit-option.wrong{border-color:var(--danger);background:rgba(160,80,80,0.15);animation:shake 0.4s}

/* ========== 谜题：时间线 ========== */
.timeline-area{display:flex;flex-direction:column;gap:10px;max-width:480px;margin:12px auto}
.timeline-event{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:rgba(50,69,84,0.4);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s}
.timeline-event:hover{border-color:var(--amber);background:rgba(196,160,98,0.08)}
.timeline-event.placed{border-color:var(--green-soft);background:rgba(106,138,106,0.1);cursor:default}
.timeline-event .tl-marker{width:28px;height:28px;border-radius:50%;background:var(--bg-soft);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--amber);font-weight:bold;flex-shrink:0}
.timeline-event.placed .tl-marker{border-color:var(--green-soft);color:var(--green-soft)}
.timeline-event .tl-content{flex:1}
.timeline-event .tl-year{font-size:14px;color:var(--amber);font-weight:bold;margin-bottom:2px}
.timeline-event .tl-desc{font-size:13px;color:var(--text-dim);line-height:1.6}
.timeline-slot{padding:10px 16px;background:rgba(50,69,84,0.2);border:1px dashed var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;min-height:48px;display:flex;align-items:center;gap:10px}
.timeline-slot:hover{border-color:var(--amber)}
.timeline-slot.filled{border-style:solid;border-color:var(--green-soft);background:rgba(106,138,106,0.08)}
.timeline-slot .ts-num{font-size:14px;color:var(--amber);font-weight:bold;min-width:20px}
.timeline-slot .ts-content{font-size:13px;color:var(--text);flex:1}

/* ========== 谜题：线索配对 ========== */
.clue-item{padding:10px 12px;background:rgba(50,69,84,0.5);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;min-height:48px;display:flex;align-items:center}
.clue-item:hover{border-color:var(--amber);background:rgba(196,160,98,0.08)}
.clue-item.selected{border-color:var(--amber);background:rgba(196,160,98,0.15);box-shadow:0 0 10px var(--amber-glow)}
.clue-item.matched{border-color:var(--green-soft);background:rgba(106,138,106,0.12);cursor:default;opacity:0.6}
.meaning-item{padding:10px 12px;background:rgba(50,69,84,0.3);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;min-height:48px;display:flex;align-items:center}
.meaning-item:hover{border-color:var(--amber);background:rgba(196,160,98,0.08)}
.meaning-item.matched{border-color:var(--green-soft);background:rgba(106,138,106,0.12);cursor:default;opacity:0.6}
.meaning-item.wrong{border-color:var(--danger);animation:shake 0.4s}

/* ========== 选择卡片 ========== */
.choice-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:480px;margin-top:16px}
.choice-card{padding:16px 20px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.3s;font-size:16px;color:var(--text);line-height:1.6}
.choice-card:hover{border-color:var(--amber);background:rgba(196,160,98,0.1);color:var(--text-bright)}
.choice-card .choice-hint{font-size:13px;color:var(--text-dim);margin-top:4px}

/* ========== 结局 ========== */
.ending-screen{text-align:center;padding:10px 16px 60px}
.ending-title{font-family:var(--serif);font-size:30px;color:var(--text-bright);margin-bottom:14px;letter-spacing:4px}
.ending-text{font-family:var(--serif);font-size:17px;line-height:2.2;color:var(--text);max-width:560px;margin:0 auto;text-align:justify}
.ending-text p{margin-bottom:12px;opacity:0;animation:textFade 0.8s forwards}
.ending-text p:nth-child(1){animation-delay:0.5s}
.ending-text p:nth-child(2){animation-delay:1.5s}
.ending-text p:nth-child(3){animation-delay:2.5s}
.ending-text p:nth-child(4){animation-delay:3.5s}
.ending-text p:nth-child(5){animation-delay:4.5s}
.ending-text p:nth-child(6){animation-delay:5.5s}
.easter-egg{margin-top:20px;padding:14px 20px;background:rgba(196,160,98,0.08);border:1px dashed var(--amber);border-radius:8px;font-size:14px;color:var(--amber-soft);line-height:1.8;text-align:center;max-width:520px;margin-left:auto;margin-right:auto;opacity:0;animation:textFade 1s forwards;animation-delay:7s}

/* ========== 物品栏 ========== */
#inventory{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:50;padding:8px 14px;background:rgba(30,42,53,0.9);border:1px solid var(--border);border-radius:10px}
.inv-slot{width:36px;height:36px;border-radius:6px;background:rgba(50,69,84,0.5);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:default;position:relative}
.inv-slot.has-item{border-color:var(--amber);background:rgba(196,160,98,0.1)}
.inv-slot .inv-tip{display:none;position:absolute;bottom:44px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--text);background:rgba(30,42,53,0.95);padding:4px 10px;border-radius:4px;border:1px solid var(--border)}
.inv-slot:hover .inv-tip{display:block}

/* ========== 场景背景变化 ========== */
.bg-act1{background:linear-gradient(180deg,#1e2a35 0%,#2a3a48 100%)}
.bg-act2{background:linear-gradient(180deg,#1a2530 0%,#26323e 100%)}
.bg-act3{background:linear-gradient(180deg,#151820 0%,#1e2230 100%)}
.bg-act4{background:linear-gradient(180deg,#1a2018 0%,#252e20 100%)}
.bg-act5{background:linear-gradient(180deg,#1c1820 0%,#2a2030 100%)}
.bg-act6{background:linear-gradient(180deg,#222018 0%,#2e2a1e 100%)}
.bg-end{background:linear-gradient(180deg,#1e2a35 0%,#2a3540 100%)}

/* ========== 日记/书信展示 ========== */
.doc-view{width:100%;max-width:560px;background:rgba(220,210,190,0.06);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin:12px 0;font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--text-dim)}
.doc-view .doc-title{font-size:14px;color:var(--amber);margin-bottom:10px;letter-spacing:2px}
.doc-line{margin-bottom:6px}

/* ========== 提示按钮 ========== */
.hint-btn{position:fixed;top:10px;left:16px;font-size:13px;color:var(--text-dim);z-index:100;padding:4px 12px;border:1px solid var(--border);border-radius:4px;background:rgba(30,42,53,0.8);transition:all 0.3s}
.hint-btn:hover{color:var(--amber);border-color:var(--amber)}
.hint-panel{position:fixed;top:40px;left:16px;max-width:300px;padding:14px 18px;background:rgba(30,42,53,0.95);border:1px solid var(--amber);border-radius:8px;font-size:14px;color:var(--text);line-height:1.7;z-index:101;display:none}
.hint-panel.show{display:block}

/* ========== 回顾按钮 ========== */
#reviewBtn{position:fixed;bottom:60px;left:10px;font-size:12px;color:var(--text-dim);z-index:100;padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:rgba(30,42,53,0.8);transition:all 0.3s;display:none}
#reviewBtn:hover{color:var(--amber);border-color:var(--amber)}
#reviewPanel{position:fixed;bottom:94px;left:10px;max-width:340px;padding:14px 18px;background:rgba(30,42,53,0.97);border:1px solid var(--amber);border-radius:8px;font-size:14px;color:var(--text);line-height:1.7;z-index:101;display:none;max-height:50vh;overflow-y:auto}
#reviewPanel.show{display:block}
#reviewPanel::-webkit-scrollbar{width:4px}
#reviewPanel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#reviewPanel .review-item{padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
#reviewPanel .review-item:last-child{border-bottom:none}
#reviewPanel .review-item:hover{color:var(--amber-soft)}
#reviewPanel .review-ri{font-size:11px;color:var(--text-dim);margin-top:2px}

.fade-overlay{position:fixed;inset:0;background:var(--bg-deep);z-index:200;opacity:0;pointer-events:none;transition:opacity 0.6s}
.fade-overlay.show{opacity:1;pointer-events:all}
</style>
</head>
<body>

<div class="fog-layer"><div class="fog-extra"></div></div>
<div class="vignette"></div>
<div id="progress-bar"></div>
<div id="act-indicator"></div>
<button class="hint-btn" id="hintBtn" onclick="toggleHint()" style="display:none">提示</button>
<div class="hint-panel" id="hintPanel"></div>
<button class="hint-btn" id="reviewBtn" onclick="toggleReview()" style="display:none">📖 回顾</button>
<div id="reviewPanel"></div>

<div id="game">
<div id="stage"></div>
</div>

<div id="inventory" style="display:none"></div>
<div class="fade-overlay" id="fadeOverlay"></div>
<div class="item-modal" id="itemModal" onclick="if(event.target===this)closeItemModal()"><div class="item-modal-content" id="itemModalContent"></div></div>

<script>
// ============================================================
// 游戏数据
// ============================================================
var inventory = [];
var gameState = {
  currentScene: 'cover',
  act: 0, progress: 0,
  foundItems: [], puzzleSolved: {},
  diaryUnlocked: false, // 日记可回顾
  ending: null
};

// 可回顾的线索资料
var reviewData = {
  diary: {
    title: '奶奶的日记',
    content: '"……月圆夜雾最重，结界又裂了……我快撑不住了……"<br>"……傻根今天又跑到后山入口坐着了，我得去把他领回来……"<br>"……树儿该进城了，越远越好，别回来……"<br>——日记第十二页还记载了槐树林石阵的线索和一首童谣。'
  },
  diaryPage12: {
    title: '日记第十二页',
    content: '"槐树开花，接人回家，<br>七块乱石挡住路，<br>年画在前头，货架上留痕，<br>傻根嘴里有口诀。<br>排对了进，排错了回。"<br><span style="color:var(--amber)">——后山槐树林入口有石阵，须按顺序排列方可通过。</span>'
  },
  photo: {
    title: '老照片',
    content: '一张褪色的集体照，十几个人站在一棵大槐树下，表情严肃。照片背面写着："1953年秋，雾落村。"'
  },
  letters: {
    title: '铁皮盒中的书信',
    content: '泛黄的信纸，字迹工整，是当年被救的孤儿长大后写给守槐人的感谢信。其中一封写道："我如今也有了孩子，会告诉他，是雾落村17个无名英雄救了我们。"'
  },
  sachet: {
    title: '香囊线索',
    content: '两块香囊拼合后，内侧绣着"翻至十二"字样。这是指向日记第十二页的关键线索。'
  }
};

// ============================================================
// 渲染引擎
// ============================================================
function renderScene(sceneId) {
  var stage = document.getElementById('stage');
  var old = stage.querySelector('.scene.active, #cover');
  if(old) { old.style.opacity = '0'; old.style.transform = 'translateY(-10px)'; }

  setTimeout(function(){
    stage.innerHTML = '';
    var scene = scenes[sceneId];
    if(!scene) return;
    gameState.currentScene = sceneId;
    document.body.className = scene.bg || '';
    if(scene.progress) {
      gameState.progress = scene.progress;
      document.getElementById('progress-bar').style.width = scene.progress + '%';
    }
    document.getElementById('act-indicator').textContent = scene.actLabel || '';

    var hintBtn = document.getElementById('hintBtn');
    if(scene.hint) { hintBtn.style.display = 'block'; document.getElementById('hintPanel').textContent = scene.hint; }
    else { hintBtn.style.display = 'none'; document.getElementById('hintPanel').classList.remove('show'); }

    // 回顾按钮
    var rBtn = document.getElementById('reviewBtn');
    if(gameState.diaryUnlocked && sceneId !== 'cover') { rBtn.style.display = 'block'; }
    else { rBtn.style.display = 'none'; document.getElementById('reviewPanel').classList.remove('show'); }

    updateInventory();

    var div = document.createElement('div');
    div.className = 'scene';
    div.id = 'scene-' + sceneId;
    if(scene.type === 'cover') div.innerHTML = renderCover(scene);
    else if(scene.type === 'narrative') div.innerHTML = renderNarrative(scene);
    else if(scene.type === 'puzzle') div.innerHTML = renderPuzzle(scene);
    else if(scene.type === 'choice') div.innerHTML = renderChoice(scene);
    else if(scene.type === 'ending') div.innerHTML = renderEnding(scene);
    stage.appendChild(div);
    setTimeout(function(){ div.classList.add('active'); }, 50);
    if(scene.onRender) scene.onRender();
  }, old ? 600 : 0);
}

function renderCover(s) {
  return '<div id="cover" style="opacity:1;transform:none;position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    + '<div class="cover-bg"></div>'
    + '<div class="cover-img-wrap"><img src="cover-art.jpg" alt="雾落村" onerror="this.style.display=\'none\';document.querySelector(\'.cover-bg\').style.opacity=\'1\'"></div>'
    + '<div class="cover-title-wrap">'
    + '<div class="cover-sub">山村微恐系列 · 第一部</div>'
    + '<div class="cover-title">雾落村</div>'
    + '<div style="font-family:var(--serif);font-size:28px;color:var(--amber);letter-spacing:12px;margin-bottom:8px">槐 香 引</div>'
    + '<div class="cover-subtitle">那些浓雾深处的秘密，等一个敢回头的人</div>'
    + '<button class="cover-btn" onclick="renderScene(\'act1_1\')">进 山</button>'
    + '<div style="margin-top:24px;font-size:12px;color:var(--text-dim);letter-spacing:3px;opacity:0;animation:textFade 1s forwards;animation-delay:2s">第二部 · 敬请期待</div>'
    + '</div>'
    + '<div class="cover-credit">建议在桌面端体验 · 时长约40-50分钟</div>'
    + '</div>';
}

function renderNarrative(s) {
  var html = '';
  if(s.actTag) html += '<div class="act-tag">' + s.actTag + '</div>';
  if(s.title) html += '<div class="scene-title">' + s.title + '</div>';
  if(s.img) html += '<div class="scene-img-wrap"><img class="scene-img" src="' + s.img + '" alt="场景" onerror="this.style.display=\'none\'"><div class="scene-img-caption">' + (s.imgCap||'') + '</div></div>';
  html += '<div class="narrative">';
  if(s.text) s.text.forEach(function(p){ html += '<p>' + p + '</p>'; });
  html += '</div>';
  if(s.choices) {
    html += '<div class="btn-row">';
    s.choices.forEach(function(c){ html += '<button class="btn ' + (c.style||'') + '" onclick="renderScene(\'' + c.next + '\')">' + c.text + '</button>'; });
    html += '</div>';
  }
  if(s.next) {
    html += '<div class="btn-row"><button class="btn" onclick="renderScene(\'' + s.next + '\')">' + (s.nextText||'继 续') + '</button></div>';
  }
  return html;
}

function renderPuzzle(s) {
  var html = '';
  if(s.actTag) html += '<div class="act-tag">' + s.actTag + '</div>';
  if(s.title) html += '<div class="scene-title">' + s.title + '</div>';
  if(s.img) html += '<div class="scene-img-wrap"><img class="scene-img" src="' + s.img + '" alt="场景" onerror="this.style.display=\'none\'"><div class="scene-img-caption">' + (s.imgCap||'') + '</div></div>';
  html += '<div class="narrative"><p>' + s.desc + '</p></div>';
  if(s.puzzleHtml) html += s.puzzleHtml();
  if(s.next) {
    html += '<div class="btn-row" id="puzzle-next" style="display:none"><button class="btn" onclick="renderScene(\'' + s.next + '\')">' + (s.nextText||'继 续') + '</button></div>';
  }
  return html;
}

function renderChoice(s) {
  var html = '';
  if(s.actTag) html += '<div class="act-tag">' + s.actTag + '</div>';
  if(s.title) html += '<div class="scene-title">' + s.title + '</div>';
  if(s.img) html += '<div class="scene-img-wrap"><img class="scene-img" src="' + s.img + '" alt="场景" onerror="this.style.display=\'none\'"><div class="scene-img-caption">' + (s.imgCap||'') + '</div></div>';
  html += '<div class="narrative"><p>' + s.desc + '</p></div>';
  html += '<div class="choice-list">';
  s.choices.forEach(function(c){ html += '<div class="choice-card" onclick="renderScene(\'' + c.next + '\')"><div>' + c.text + '</div>' + (c.hint?'<div class="choice-hint">'+c.hint+'</div>':'') + '</div>'; });
  html += '</div>';
  return html;
}

function renderEnding(s) {
  var html = '<div class="ending-screen">';
  if(s.img) html += '<div class="scene-img-wrap" style="margin-bottom:14px"><img class="scene-img" src="' + s.img + '" alt="结局" onerror="this.style.display=\'none\'"></div>';
  html += '<div class="ending-title">' + s.title + '</div>';
  html += '<div class="ending-text">';
  s.text.forEach(function(p){ html += '<p>' + p + '</p>'; });
  html += '</div>';
  if(s.egg) html += '<div class="easter-egg">' + s.egg + '</div>';
  html += '<div class="btn-row" style="margin-top:30px;opacity:0;animation:textFade 1s forwards;animation-delay:8s"><button class="btn" onclick="location.reload()">重新开始</button></div>';
  html += '</div>';
  return html;
}

// ============================================================
// 物品栏
// ============================================================
function addItem(id, icon, name) { if(inventory.find(function(i){return i.id===id})) return; inventory.push({id:id,icon:icon,name:name}); updateInventory(); }
function removeItem(id) { inventory = inventory.filter(function(i){return i.id!==id}); updateInventory(); }
function hasItem(id) { return inventory.some(function(i){return i.id===id}); }
function updateInventory() {
  var inv = document.getElementById('inventory');
  if(inventory.length === 0) { inv.style.display = 'none'; return; }
  inv.style.display = 'flex';
  var html = '';
  for(var i=0; i<5; i++) {
    var item = inventory[i];
    if(item) html += '<div class="inv-slot has-item"><span>' + item.icon + '</span><span class="inv-tip">' + item.name + '</span></div>';
    else html += '<div class="inv-slot"></div>';
  }
  inv.innerHTML = html;
}

// ============================================================
// 提示 & 回顾
// ============================================================
function toggleHint() { document.getElementById('hintPanel').classList.toggle('show'); }
function toggleReview() { document.getElementById('reviewPanel').classList.toggle('show'); }
function showReviewItem(key) {
  var item = reviewData[key];
  if(!item) return;
  document.getElementById('reviewPanel').innerHTML = '<div style="font-size:14px;font-weight:bold;color:var(--amber);margin-bottom:8px">' + item.title + '</div>'
    + '<div style="font-size:13px;line-height:1.8">' + item.content + '</div>'
    + '<div style="text-align:right;margin-top:6px"><button class="btn sm" onclick="document.getElementById(\'reviewPanel\').classList.remove(\'show\')">关 闭</button></div>';
}

// ============================================================
// 物品详情弹窗
// ============================================================
function openItemModal(icon, title, desc, actions) {
  var modal = document.getElementById('itemModal');
  var content = document.getElementById('itemModalContent');
  var html = '<div class="item-modal-icon">' + icon + '</div>'
    + '<div class="item-modal-title">' + title + '</div>'
    + '<div class="item-modal-desc">' + desc + '</div>';
  if(actions) {
    html += '<div class="item-modal-actions">';
    actions.forEach(function(a){
      html += '<button class="btn ' + (a.style||'') + '" onclick="' + a.onclick + '">' + a.text + '</button>';
    });
    html += '</div>';
  } else {
    html += '<div class="item-modal-actions"><button class="btn sm" onclick="closeItemModal()">关 闭</button></div>';
  }
  content.innerHTML = html;
  modal.classList.add('show');
}
function closeItemModal() { document.getElementById('itemModal').classList.remove('show'); }

// ============================================================
// 场景数据
// ============================================================
var scenes = {};

// ========== 封面 ==========
scenes['cover'] = {
  type:'cover', bg:'bg-act1',
  onRender: function() {
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('act-indicator').textContent = '';
    document.getElementById('inventory').style.display = 'none';
    document.getElementById('reviewBtn').style.display = 'none';
  }
};

// ========== 第一幕：归乡·雾起 ==========
scenes['act1_1'] = {
  type:'narrative', bg:'bg-act1', actTag:'第 一 幕', actLabel:'第一幕 · 归乡',
  title:'归乡·雾起', progress:3,
  img:'scene-cover.jpg', imgCap:'村口石碑隐没在浓雾中',
  hint:'点击"继续"推进剧情',
  text:[
    '大巴在盘山公路上颠了四个小时，你——<span class="em">陈树</span>，26岁，快递站分拣员，终于看见了"雾落村"三个字。',
    '车窗外面的世界越来越安静。柏油路变成了碎石路，电线杆越来越稀，最后一根上还挂着个断了线的喇叭。',
    '村口石碑上的字被青苔啃了一半，碑身有几道<span class="em">深深的划痕</span>，像是被什么利器反复刻过。浓雾把整个村子裹在里头，手机信号一格都没有。',
    '你站在碑前，深深吸了一口气。空气里有湿土的味道，还有一丝说不清的甜香——像是什么花。'
  ],
  next:'act1_1b', nextText:'往村里走'
};

scenes['act1_1b'] = {
  type:'narrative', bg:'bg-act1', actTag:'第 一 幕', actLabel:'第一幕 · 归乡',
  title:'进村路上', progress:6,
  img:'scene-cover.jpg', imgCap:'进村的小路，雾气从两侧漫上来',
  hint:'老支书在等你，他的话要放在心上。',
  text:[
    '沿着石板路往里走，两边的土坯房大多关着门。偶尔有窗帘掀开一条缝，露出半张脸，看见你又迅速拉上了。',
    '一个瘸了左腿的老人站在路中间等你。老支书<span class="em">周建国</span>，68岁，脸上没有一丝笑容，裤腿上还沾着泥。',
    '"来了。"他的声音像砂纸磨过木头，"三句话记好：<span class="danger">办完丧事就走，晚上别出门，绝对别去后山槐树林。</span>"',
    '你想问为什么，他已经转过身，一瘸一拐地往村尾走了。背影融进雾里，很快就看不见了。',
    '你没吭声，低着头往奶奶的老房子走。路两旁的槐花开得正盛，花落了一地，像铺了层雪。'
  ],
  next:'act1_1c', nextText:'推开家门'
};

scenes['act1_1c'] = {
  type:'narrative', bg:'bg-act1', actTag:'第 一 幕', actLabel:'第一幕 · 归乡',
  title:'老屋', progress:9,
  img:'scene-oldhouse.jpg', imgCap:'老房子里，槐花香依然弥漫',
  hint:'屋里有很多东西可以看看。',
  text:[
    '推开木门，吱呀一声。屋里还留着<span class="warm">槐花的香味</span>，和记忆里一模一样。',
    '堂屋正中摆着奶奶的遗像，黑白照片上，她笑得很慈祥。供桌上放着一碗干了的槐花饭，还有半杯凉茶。',
    '你在遗像前站了很久。上次回来还是三年前，奶奶攥着你的手说，城里好就别回来了。',
    '墙角放着一个<span class="em">上了锁的旧木箱</span>，铜锁已经发绿了。你记得这个箱子——小时候奶奶不让你碰，说等她走了再打开。',
    '现在，是时候了。'
  ],
  next:'act1_2', nextText:'找找钥匙'
};

scenes['act1_2'] = {
  type:'puzzle', bg:'bg-act1', actTag:'第 一 幕', actLabel:'第一幕 · 归乡',
  title:'奶奶的老房子', progress:8,
  img:'scene-oldhouse.jpg', imgCap:'老房子里，槐花香依然弥漫',
  hint:'先找到剪纸仔细看——它指向针线笸箩里的东西。找到顶针后，按剪纸上的箭头方向旋转顶针，才能取出钥匙。',
  desc:'屋里陈设简朴，东西不多但都有些年头了。你需要找到打开木箱的方法。<br><br><span style="color:var(--amber-soft);font-size:14px">提示：仔细检查每件物品，有些线索藏在细节里。找到的物品可以再次点击查看。</span>',
  puzzleHtml: function(){
    return '<div class="room-view">'
      + '<div class="puzzle-steps">'
      + '<div class="puzzle-step" id="step1"></div>'
      + '<div class="puzzle-step" id="step2"></div>'
      + '<div class="puzzle-step" id="step3"></div>'
      + '<div class="puzzle-step" id="step4"></div>'
      + '</div>'
      + '<div class="room-desc">在屋里搜寻线索（共4步，按顺序完成）</div>'
      + '<div class="items-grid">'
      + '<div class="item-slot" onclick="examineItem(\'photo\')" style="font-size:22px">🖼</div>'
      + '<div class="item-slot" onclick="examineItem(\'papercut\')" style="font-size:22px">✂</div>'
      + '<div class="item-slot" onclick="examineItem(\'basket\')" style="font-size:22px">🧵</div>'
      + '<div class="item-slot" onclick="examineItem(\'thimble\')" style="font-size:22px">⭕</div>'
      + '<div class="item-slot" onclick="examineItem(\'box\')" style="font-size:22px">📦</div>'
      + '<div class="item-slot" onclick="examineItem(\'calendar\')" style="font-size:22px">📅</div>'
      + '<div class="item-slot" onclick="examineItem(\'window\')" style="font-size:22px">🪟</div>'
      + '<div class="item-slot" onclick="examineItem(\'door\')" style="font-size:22px">🚪</div>'
      + '<div class="item-slot" onclick="examineItem(\'drawer\')" style="font-size:22px">🗄</div>'
      + '<div class="item-slot" onclick="examineItem(\'lamp\')" style="font-size:22px">🪔</div>'
      + '<div class="item-slot" onclick="examineItem(\'shelf\')" style="font-size:22px">📚</div>'
      + '<div class="item-slot" onclick="examineItem(\'mirror\')" style="font-size:22px">🪞</div>'
      + '</div>'
      + '<div class="puzzle-feedback" id="search-feedback"></div>'
      + '</div>';
  },
  onRender: function() {
    var stepDone = {s1:false, s2:false, s3:false, s4:false};
    var foundItems = {};

    function updateSteps() {
      var steps = ['s1','s2','s3','s4'];
      steps.forEach(function(s, i){

    function openTwistPuzzle() {

      var twistDir = null;

        + '<div class="item-modal-desc">顶针底部可以转动。剪纸上的箭头是<span style="color:var(--amber)">顺时针↻</span>，背面写着"转三圈，开口现"。<br><br>选择旋转方向，然后旋转：</div>'

        + '<div class="twist-dial" id="twistDial" style="transform:rotate(0deg)">'
        + '<div class="twist-pointer"></div>'
        + '</div>'
        + '<div style="display:flex;gap:12px;justify-content:center;margin-top:10px">'
        + '<button class="btn sm" id="dirCW" onclick="selectTwistDir(\'cw\')">↻ 顺时针</button>'
        + '<button class="btn sm" id="dirCCW" onclick="selectTwistDir(\'ccw\')">↺ 逆时针</button>'
        + '</div>'
        + '<div style="text-align:center;margin-top:10px"><button class="btn" id="twistBtn" onclick="doTwist()" disabled>旋 转</button></div>'
        + '<div style="text-align:center;margin-top:6px;font-size:13px;color:var(--text-dim)" id="twistStatus">已旋转 0/3 圈</div>'
        + '</div>'
        + '<div class="item-modal-actions"><button class="btn sm" onclick="closeItemModal()">放 下</button></div>';
      modal.classList.add('show');

      window.selectTwistDir = function(dir) {
        twistDir = dir;
        document.getElementById('dirCW').style.opacity = dir==='cw' ? '1' : '0.4';
        document.getElementById('dirCCW').style.opacity = dir==='ccw' ? '1' : '0.4';
        document.getElementById('twistBtn').disabled = false;
      };

      window.doTwist = function() {
        if(!twistDir) return;
        var dial = document.getElementById('twistDial');
        var currentRot = parseFloat(dial.style.transform.replace(/[^\d-]/g,'')) || 0;
        if(twistDir === 'cw') {
          currentRot += 360;
          dial.style.transform = 'rotate(' + currentRot + 'deg)';
        } else {
          currentRot -= 360;
          dial.style.transform = 'rotate(' + currentRot + 'deg)';
        }

        if(twistDir === 'cw') {
          twistCount++;
          document.getElementById('twistStatus').textContent = '已旋转 ' + twistCount + '/3 圈';
          if(twistCount >= 3) {
            document.getElementById('twistStatus').innerHTML = '<span style="color:var(--green-soft)">咔哒！顶针底部弹开了！</span>';

                + '<div class="item-modal-desc">顶针底部弹开，里面藏着一把<span style="color:var(--amber)">小铜钥匙</span>！<br><br>这把钥匙应该能打开墙角的旧木箱。</div>'
                + '<div class="item-modal-actions"><button class="btn" onclick="closeItemModal(); gotKey();">拿走钥匙</button></div>';
            }, 800);
          }
        } else {
          twistCount = 0;
          document.getElementById('twistStatus').innerHTML = '<span style="color:var(--danger)">方向不对，顶针纹丝不动。重试。</span>';
          dial.style.transform = 'rotate(0deg)';
        }
      };
    }

      stepDone.s3 = true;
      updateSteps();
      addItem('key','🔑','铜钥匙');
      fb('<span style="color:var(--amber)">找到铜钥匙了！可以打开木箱。</span>', 'var(--amber)');

      var ts = document.querySelectorAll('.item-slot')[3];

      setTimeout(function() {
        stepDone.s4 = true;

        document.getElementById('puzzle-next').style.display = 'flex';
      }, 1000);
    };

    // 允许已找到的物品重复点击
    var slots = document.querySelectorAll('.item-slot');

      s.addEventListener('click', function(){

          // 已经处理过了，examineItem会再次显示
        }
      });
    });
