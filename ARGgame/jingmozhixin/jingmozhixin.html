<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静默之心 | 静心心理咨询中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --deep-blue: #0f1420;
            --mid-blue: #1a1f3c;
            --accent-red: #8b2635;
            --accent-gold: #c9a961;
            --text-light: #e8e4df;
            --text-dim: #8a8a8a;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--deep-blue);
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: url('index-bg.jpg') center/cover no-repeat;
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }
        
        /* 噪点纹理背景 */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }
        
        /* 心电图线条动画 */
        .ecg-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 2;
            opacity: 0.3;
        }
        
        .ecg-line {
            fill: none;
            stroke: var(--accent-red);
            stroke-width: 1.5;
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: ecg-draw 4s ease-out forwards, ecg-pulse 4s ease-in-out infinite 4s;
        }
        
        @keyframes ecg-draw {
            to { stroke-dashoffset: 0; }
        }
        
        @keyframes ecg-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        /* 主内容区 */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
        }
        
        /* 小标签 */
        .tag {
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
            text-transform: uppercase;
        }
        
        /* 主标题 */
        .title {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            position: relative;
            opacity: 0;
            animation: fadeInUp 1.2s ease 1s forwards;
        }
        
        .title .glitch {
            position: relative;
            display: inline-block;
        }
        
        .title .glitch::before,
        .title .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        
        .title .glitch::before {
            color: var(--accent-red);
            animation: glitch-1 3s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }
        
        .title .glitch::after {
            color: #4a6fa5;
            animation: glitch-2 2.5s infinite linear alternate-reverse;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }
        
        @keyframes glitch-1 {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-3px, 1px); }
            94% { transform: translate(2px, -1px); }
            96% { transform: translate(-1px, 2px); }
        }
        
        @keyframes glitch-2 {
            0%, 88%, 100% { transform: translate(0); }
            90% { transform: translate(2px, -1px); }
            93% { transform: translate(-2px, 1px); }
            96% { transform: translate(1px, -2px); }
        }
        
        /* 副标题 */
        .subtitle {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: var(--text-dim);
            letter-spacing: 0.3em;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1.5s forwards;
        }
        
        /* 装饰线 */
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1.8s forwards;
        }
        
        /* 开始按钮 */
        .start-btn {
            position: relative;
            padding: 1rem 3rem;
            font-size: 1rem;
            letter-spacing: 0.3em;
            color: var(--text-light);
            background: transparent;
            border: 1px solid rgba(201, 169, 97, 0.4);
            cursor: pointer;
            transition: all 0.5s ease;
            opacity: 0;
            animation: fadeInUp 1s ease 2.2s forwards;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        
        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 38, 53, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .start-btn:hover::before {
            left: 100%;
        }
        
        .start-btn:hover {
            border-color: var(--accent-red);
            box-shadow: 0 0 30px rgba(139, 38, 53, 0.2);
            letter-spacing: 0.4em;
        }
        
        /* 底部提示 */
        .hint {
            position: absolute;
            bottom: 3rem;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            opacity: 0;
            animation: fadeInUp 1s ease 3s forwards;
            text-align: center;
            line-height: 1.8;
        }
        
        .hint .warning {
            color: var(--accent-red);
            opacity: 0.7;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 漂浮粒子 */
        .particles {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(201, 169, 97, 0.3);
            border-radius: 50%;
            animation: float-up linear infinite;
        }
        
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        
        /* 加载遮罩 */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--deep-blue);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            color: var(--accent-gold);
            animation: loading-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes loading-pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="loading-text">正在连接档案系统...</div>
    </div>
    
    <div class="particles" id="particles"></div>
    
    <svg class="ecg-container" viewBox="0 0 1200 200" preserveAspectRatio="none">
        <path class="ecg-line" d="M0,100 L200,100 L220,100 L230,60 L240,140 L250,40 L260,160 L270,100 L300,100 L320,100 L340,100 L350,80 L360,120 L370,70 L380,130 L390,100 L420,100 L440,100 L460,100 L470,60 L480,140 L490,40 L500,160 L510,100 L540,100 L560,100 L580,100 L590,80 L600,120 L610,70 L620,130 L630,100 L660,100 L680,100 L700,100 L710,60 L720,140 L730,40 L740,160 L750,100 L780,100 L800,100 L820,100 L830,80 L840,120 L850,70 L860,130 L870,100 L900,100 L920,100 L940,100 L950,60 L960,140 L970,40 L980,160 L990,100 L1020,100 L1040,100 L1060,100 L1070,80 L1080,120 L1090,70 L1100,130 L1110,100 L1200,100"/>
    </svg>
    
    <div class="main-content">
        <div class="tag">—— 网页解谜游戏 ——</div>
        <h1 class="title">
            <span class="glitch" data-text="静默之心">静默之心</span>
        </h1>
        <p class="subtitle">静心心理咨询中心 · 事件调查档案</p>
        <div class="divider"></div>
        <button class="start-btn" onclick="startGame()">开始调查</button>
        
        <div class="hint">
            <span class="warning">警告：</span>本档案包含未公开的调查资料<br>
            部分内容可能引发不适，请谨慎浏览<br>
            <span style="opacity:0.5;margin-top:0.5rem;display:block;">本网站纯属虚构，仅供娱乐解谜</span>
        </div>
    </div>
    
    <script>
        // 生成漂浮粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(p);
            }
        }
        
        // 加载完成后隐藏遮罩
        window.addEventListener('load', () => {
            createParticles();
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);
        });
        
        function startGame() {
            document.body.style.transition = 'opacity 1s ease';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'game.html';
            }, 1000);
        }
    </script>
</body>
</html>
