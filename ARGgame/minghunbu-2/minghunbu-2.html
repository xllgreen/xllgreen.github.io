<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冥婚簿 · 续</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0a0807;color:#c4b998;font-family:"Noto Serif SC","STSong","SimSun",serif;display:flex;justify-content:center;align-items:center}

/* 背景图 */
.bg-image{position:fixed;inset:0;z-index:0;background:url('cover-bg.jpg') center/cover no-repeat;opacity:0.45}
.bg-overlay{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 50%,rgba(10,8,7,0.5) 0%,rgba(10,8,7,0.85) 70%,rgba(10,8,7,1) 100%)}
.fog{position:fixed;inset:0;z-index:2;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none}
.moon-glow{position:fixed;top:10%;right:10%;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(180,30,30,0.15) 0%,transparent 70%);z-index:2;animation:moonPulse 4s ease-in-out infinite;pointer-events:none}
@keyframes moonPulse{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:0.8;transform:scale(1.05)}}

/* 开场动画 */
#intro-overlay{position:fixed;inset:0;z-index:50;background:#0a0807;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 2s ease}
#intro-overlay.fade{opacity:0;pointer-events:none}
.intro-text{color:#8a7d6a;font-size:16px;line-height:2.6;letter-spacing:3px;max-width:560px;padding:0 30px;opacity:0;animation:fadeUp 1.5s forwards;text-align:center}
.intro-text:nth-child(1){animation-delay:0.5s}
.intro-text:nth-child(2){animation-delay:2.5s}
.intro-text:nth-child(3){animation-delay:4.5s}
.intro-btn{margin-top:35px;padding:10px 40px;background:transparent;border:1px solid #5a3a2a;color:#8a6d5a;font-family:inherit;font-size:14px;letter-spacing:4px;cursor:pointer;opacity:0;animation:fadeUp 1s forwards 6.5s;transition:all 0.4s}
.intro-btn:hover{border-color:#a04040;color:#c08070;box-shadow:0 0 20px rgba(160,64,64,0.3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* 主封面 */
#cover{position:relative;z-index:10;text-align:center;width:90%;max-width:680px;display:none}
#cover.show{display:block;animation:fadeIn 2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.game-title{font-size:62px;letter-spacing:20px;color:#7b2020;text-shadow:0 0 50px rgba(120,30,30,0.6),0 0 100px rgba(80,10,10,0.3);margin-bottom:4px;font-weight:bold;animation:titleGlow 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 0 50px rgba(120,30,30,0.6),0 0 100px rgba(80,10,10,0.3)}50%{text-shadow:0 0 60px rgba(160,40,40,0.8),0 0 120px rgba(100,20,20,0.4)}}
.game-subtitle{font-size:15px;color:#5a4a3a;letter-spacing:10px;margin-bottom:50px}
.game-divider{width:200px;height:1px;background:linear-gradient(90deg,transparent,#5a3a2a,transparent);margin:0 auto 50px}

.start-btn{display:inline-block;padding:16px 60px;background:transparent;border:1px solid #5a3a2a;color:#9a8d7a;font-family:inherit;font-size:18px;letter-spacing:8px;cursor:pointer;transition:all 0.5s;text-decoration:none;border-radius:2px;position:relative;overflow:hidden}
.start-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(139,48,48,0.1),transparent);transform:translateX(-100%);transition:transform 0.6s}
.start-btn:hover{border-color:#a04040;color:#c08070;box-shadow:0 0 40px rgba(160,64,64,0.3);letter-spacing:10px}
.start-btn:hover::before{transform:translateX(100%)}

.original-link{display:block;margin-top:25px;font-size:12px;color:#4a3a2a;letter-spacing:3px;text-decoration:none;transition:color 0.3s}
.original-link:hover{color:#6a5a4a}
</style>
</head>
<body>
<div class="bg-image"></div>
<div class="bg-overlay"></div>
<div class="fog"></div>
<div class="moon-glow"></div>

<!-- 开场动画 -->
<div id="intro-overlay">
<p class="intro-text">嘉靖三十五年，七月。</p>
<p class="intro-text">沈府冥婚夜，新娘消失，家主暴毙。<br>你以为案子已经了结——</p>
<p class="intro-text">井底之下，还有更深的秘密。</p>
<button class="intro-btn" onclick="startGame()">进 入</button>
</div>

<!-- 主封面 -->
<div id="cover">
<h1 class="game-title">冥婚簿</h1>
<p class="game-subtitle">· 续 ·</p>
<div class="game-divider"></div>
<a href="intro.html" class="start-btn">开 始 办 案</a>
<a href="https://mike798-cloud.github.io/minghun/" class="original-link">← 游玩前作《冥婚簿》</a>
</div>

<script>
function startGame(){
document.getElementById('intro-overlay').classList.add('fade');
setTimeout(()=>{
document.getElementById('intro-overlay').style.display='none';
document.getElementById('cover').classList.add('show');
},2000);
}
</script>
</body>
</html>
