<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>感谢游玩｜星河乐园</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/thanks.css">

<body class="thanks-page">
  <main class="thanks-sheet">
    <p class="thanks-kicker">GALAXY PARK ARG</p>
    <h1>感谢游玩</h1>
    <p>感谢你愿意在旧新闻、失效链接、附件编号和广播日志之间来回寻找。</p>
    <p>创作这段 ARG 时，我最想留下的不是突然的惊吓，而是当普通网站里的文字开始互相矛盾时，那种慢慢意识到自己读见了不该存在的记录的感觉。把乐园、政务网站和档案系统写成不同的年代与语气，让每一条谜题都能从资料里公平推出来，又不把答案直接摆在页面上，是整个创作过程中最难、也最有意思的部分。</p>
    <p>希望你离开星河乐园以后，偶尔在公共广播响起、许多人同时抬头的时候，还会想起 16:17、那枚银色星形纽扣，以及一句你原本不该读到的话。</p>
    <section class="thanks-author">
      <span>作者</span>
      <a href="https://space.bilibili.com/1806769398?spm_id_from=333.1007.0.0" target="_blank" rel="noopener"><strong>凛雪</strong>YukiRins</a>
    </section>
    <div class="thanks-actions">
      <button type="button" data-thanks-reset>重置游戏 / 清除进度</button>
      <button type="button" data-thanks-back>返回结局</button>
    </div>
    <p class="thanks-status" data-thanks-status aria-live="polite"></p>
  </main>
  <script src="assets/js/thanks.js"></script>
</body>
</html>
