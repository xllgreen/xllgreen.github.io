<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">星河乐园园区导览 2017</title>
  <desc id="desc">2017年园区地图，原东南区域标为停车场B区和家庭服务后区。</desc>
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 .065"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#26394a" flood-opacity=".31"/>
    </filter>
    <pattern id="grass" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#d5e6bd"/>
      <path d="M4 31l3-7m0 7l-1-10m15 8l2-8m7 11l-2-6M13 13l3-6" stroke="#9fbe85" stroke-width="1" opacity=".5"/>
      <circle cx="27" cy="9" r="1.2" fill="#f1cf62" opacity=".65"/>
    </pattern>
    <pattern id="parking" width="36" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <rect width="36" height="24" fill="#c9cfd1"/>
      <path d="M2 1v22M34 1v22" stroke="#fff" stroke-width="2"/>
    </pattern>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1dce3"/><stop offset=".55" stop-color="#64b9c8"/><stop offset="1" stop-color="#438e9e"/>
    </linearGradient>
    <radialGradient id="stain"><stop offset="0" stop-color="#465e6d" stop-opacity=".10"/><stop offset="1" stop-color="#465e6d" stop-opacity="0"/></radialGradient>
    <g id="tree">
      <path d="M0 8v11" stroke="#76512d" stroke-width="3"/>
      <circle cx="-5" cy="5" r="7" fill="#68a45f"/><circle cx="4" cy="4" r="8" fill="#79b56d"/><circle cx="0" cy="-2" r="8" fill="#89bd73"/>
    </g>
    <g id="marker"><circle r="18" fill="#1f7891" stroke="#fff" stroke-width="4"/></g>
  </defs>

  <g filter="url(#shadow)"><rect x="12" y="10" width="1176" height="778" rx="4" fill="#e9ece7"/></g>
  <rect x="12" y="10" width="1176" height="778" rx="4" fill="#f3f0df" filter="url(#paperNoise)"/>
  <path d="M402 12v774M798 12v774" stroke="#5f7784" stroke-width="2" opacity=".12"/>
  <path d="M399 12v774M795 12v774" stroke="#fff" stroke-width="1.5" opacity=".55"/>
  <ellipse cx="1090" cy="706" rx="90" ry="65" fill="url(#stain)"/>

  <g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">
