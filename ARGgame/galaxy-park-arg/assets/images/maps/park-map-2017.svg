    <text x="63" y="69" font-size="29" font-weight="700" fill="#fff" letter-spacing="3">星河乐园园区导览</text>
    <text x="408" y="69" font-size="25" font-weight="700" fill="#f2c34f">2017</text>
    <text x="1135" y="65" text-anchor="end" font-size="13" fill="#d8e8ed">文明游园　安全相伴</text>

