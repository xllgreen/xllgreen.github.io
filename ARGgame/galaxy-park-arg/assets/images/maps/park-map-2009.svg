      <g transform="translate(650 548)">
        <path d="M-58-23L0-63L58-23V55H-58Z" fill="#f1d49d" stroke="#8e6550" stroke-width="4"/>
        <path d="M-68-18L0-69L68-18" fill="none" stroke="#b7554d" stroke-width="15"/>
        <rect x="-46" y="-10" width="30" height="28" fill="#8fc3c8" stroke="#fff4d0" stroke-width="3"/>
        <rect x="16" y="-10" width="30" height="28" fill="#8fc3c8" stroke="#fff4d0" stroke-width="3"/>
