      <path d="M606 198C647 163 734 167 785 197C830 222 848 278 821 319C790 366 713 375 653 347C606 324 573 266 606 198Z"
            fill="url(#lake)" stroke="#397f8f" stroke-width="4"/>
      <path d="M625 222C661 195 732 195 772 219C802 237 815 270 798 294C776 327 718 338 671 320C636 306 606 262 625 222Z"
            fill="none" stroke="#c8f0ed" stroke-width="2" opacity=".75"/>
      <path d="M579 186C632 137 753 139 818 179C876 214 887 292 847 342C799 403 675 407 606 365C543 326 524 238 579 186Z"
