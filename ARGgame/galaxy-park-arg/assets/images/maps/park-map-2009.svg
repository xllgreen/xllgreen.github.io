        <g transform="translate(18 78)"><circle cx="16" cy="0" r="14" fill="#d14d3e"/><text x="16" y="5" text-anchor="middle" fill="#fff" font-size="12">01</text><text x="43" y="5">正门广场</text></g>
        <g transform="translate(18 125)"><circle cx="16" cy="0" r="14" fill="#d14d3e"/><text x="16" y="5" text-anchor="middle" fill="#fff" font-size="12">02</text><text x="43" y="5">银河摩天轮</text></g>
        <g transform="translate(18 172)"><circle cx="16" cy="0" r="14" fill="#d14d3e"/><text x="16" y="5" text-anchor="middle" fill="#fff" font-size="12">03</text><text x="43" y="5">月湾小火车</text></g>
        <g transform="translate(18 219)"><circle cx="16" cy="0" r="14" fill="#d14d3e"/><text x="16" y="5" text-anchor="middle" fill="#fff" font-size="12">04</text><text x="43" y="5">儿童游艺区</text></g>
        <g transform="translate(18 266)"><circle cx="16" cy="0" r="14" fill="#d14d3e"/><text x="16" y="5" text-anchor="middle" fill="#fff" font-size="12">05</text><text x="43" y="5">星光巡游大道</text></g>
        <g transform="translate(18 313)"><circle cx="16" cy="0" r="14" fill="#d14d3e"/><text x="16" y="5" text-anchor="middle" fill="#fff" font-size="12">06</text><text x="43" y="5">家庭摄影馆</text></g>
      </g>
      <rect x="9" y="350" width="187" height="94" fill="#fff0bd" stroke="#d14d3e" stroke-width="2"/>
      <circle cx="35" cy="378" r="16" fill="#d14d3e"/><text x="35" y="383" text-anchor="middle" fill="#fff" font-size="13">07</text>
