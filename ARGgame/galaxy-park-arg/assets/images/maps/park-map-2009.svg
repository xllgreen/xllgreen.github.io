        <ellipse cx="0" cy="42" rx="75" ry="28" fill="#c5ad76" opacity=".35"/>
        <path d="M-58 15H58L42 63H-43Z" fill="#e8be55" stroke="#936a37" stroke-width="3"/>
        <path d="M0-62L-67 16H67Z" fill="#df5d50" stroke="#fff0c9" stroke-width="4"/>
        <path d="M0-62V66" stroke="#77513b" stroke-width="5"/>
