        <use href="#tree" transform="translate(115 520)"/><use href="#tree" transform="translate(125 610)"/>
        <use href="#tree" transform="translate(358 626)"/><use href="#tree" transform="translate(570 647)"/>
        <use href="#tree" transform="translate(566 478)"/><use href="#tree" transform="translate(878 381)"/>
      </g>

      <g font-size="16" font-weight="700" text-anchor="middle" fill="#fff">
        <g transform="translate(474 681)"><use href="#marker"/><text y="6">01</text></g>
        <g transform="translate(188 185)"><use href="#marker"/><text y="6">02</text></g>
        <g transform="translate(804 178)"><use href="#marker"/><text y="6">03</text></g>
        <g transform="translate(157 486)"><use href="#marker"/><text y="6">04</text></g>
        <g transform="translate(404 395)"><use href="#marker"/><text y="6">05</text></g>
        <g transform="translate(610 493)"><use href="#marker"/><text y="6">06</text></g>
        <g transform="translate(780 477)"><use href="#marker"/><text y="6">07</text></g>
