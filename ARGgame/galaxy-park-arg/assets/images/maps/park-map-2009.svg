<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">星河乐园游客导览图 2009</title>
  <desc id="desc">2009年游客折页地图，标有正门、摩天轮、月湾小火车、儿童游艺区、巡游大道、家庭摄影馆和星河家庭休息中心。</desc>
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="4" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 .09"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#4d3921" flood-opacity=".34"/>
    </filter>
    <pattern id="grass" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#dce7b4"/>
      <path d="M4 31l3-7m0 7l-1-10m15 8l2-8m7 11l-2-6M13 13l3-6" stroke="#a7c27c" stroke-width="1" opacity=".55"/>
      <circle cx="27" cy="9" r="1.2" fill="#f3d566" opacity=".75"/>
      <circle cx="11" cy="21" r="1" fill="#e79877" opacity=".65"/>
    </pattern>
    <pattern id="parking" width="34" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <rect width="34" height="22" fill="#d5d2c5"/>
      <path d="M2 1v20M32 1v20" stroke="#f5f0d7" stroke-width="2"/>
    </pattern>
    <pattern id="roofRed" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#bd6656"/>
      <path d="M0 3h12M0 9h12" stroke="#8f493f" stroke-width="1" opacity=".5"/>
    </pattern>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94d6dc"/>
      <stop offset=".55" stop-color="#63b8c5"/>
      <stop offset="1" stop-color="#4a9cac"/>
    </linearGradient>
    <radialGradient id="stain">
      <stop offset="0" stop-color="#8b6231" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8b6231" stop-opacity="0"/>
    </radialGradient>
    <g id="tree">
      <path d="M0 8v11" stroke="#76512d" stroke-width="3"/>
      <circle cx="-5" cy="5" r="7" fill="#68a45f"/>
      <circle cx="4" cy="4" r="8" fill="#79b56d"/>
      <circle cx="0" cy="-2" r="8" fill="#89bd73"/>
    </g>
    <g id="marker">
      <circle r="18" fill="#d14d3e" stroke="#fff7d7" stroke-width="4"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <rect x="12" y="10" width="1176" height="778" rx="5" fill="#f3e6c4"/>
  </g>
  <rect x="12" y="10" width="1176" height="778" rx="5" fill="#f6edcf" filter="url(#paperNoise)"/>
  <path d="M402 12v774M798 12v774" stroke="#a88e61" stroke-width="2" opacity=".18"/>
  <path d="M399 12v774M795 12v774" stroke="#fff9e8" stroke-width="1.5" opacity=".55"/>
  <ellipse cx="1082" cy="704" rx="89" ry="65" fill="url(#stain)"/>
  <ellipse cx="92" cy="89" rx="56" ry="35" fill="url(#stain)" opacity=".6"/>

  <g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <text x="58" y="64" font-size="31" font-weight="700" fill="#356b76" letter-spacing="3">星河乐园游客导览图</text>
    <text x="451" y="64" font-size="28" font-weight="700" fill="#c84f3e">2009</text>
    <text x="57" y="89" font-size="13" fill="#846f4d" letter-spacing="1">游园路线仅供参考　开放项目以当日公告为准</text>
    <path d="M55 98H1145" stroke="#d59e49" stroke-width="4"/>

