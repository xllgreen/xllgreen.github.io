<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>热搜盲区 · 正在载入调查系统</title>
<style>html,body{margin:0;height:100%;background:#0f1419;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loader{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loader b{display:block;font-size:18px;letter-spacing:3px;margin-bottom:12px}.loader p{color:#88909a;font-size:13px;line-height:1.8}.retry{margin-top:18px;padding:10px 22px;border:1px solid #555;background:#1e2530;color:#fff;border-radius:6px;cursor:pointer}</style></head>
<body><div class="loader" id="loader"><div><b>调查系统载入中</b><p>正在恢复案件界面与调查进度……</p></div></div>
<script>
(function(){
  function gameHotfix(){
    'use strict';
    const STORAGE_KEY='trending_blind_spots_progress_v3';
    let finalPromptShown=false;

    function safeRead(){
      try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;const data=JSON.parse(raw);return data&&data.progress?data:null}catch(e){return null}
    }
    function safeWrite(){
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:3,progress:{q1:!!progress.q1,q2:!!progress.q2,q3:!!progress.q3,q4:!!progress.q4},updatedAt:Date.now()}))}catch(e){}
    }
    function isComplete(){return !!(progress&&progress.q1&&progress.q2&&progress.q3&&progress.q4)}
    function goEnding(){safeWrite();window.location.href='ending-fixed.html'}

    function ensureFinalButton(){
      let btn=document.getElementById('tbs-final-entry');
      if(!btn){
        btn=document.createElement('button');btn.id='tbs-final-entry';btn.type='button';btn.textContent='进入最终抉择';
        btn.style.cssText='position:fixed;right:22px;bottom:70px;z-index:99999;border:1px solid rgba(255,255,255,.28);background:linear-gradient(135deg,#c41e3a,#8b0000);color:#fff;padding:12px 18px;border-radius:8px;font:600 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer;display:none';
        btn.addEventListener('click',goEnding);document.body.appendChild(btn);
      }
      btn.style.display=isComplete()?'block':'none';
      return btn;
    }
    function showFinalModal(){
      if(finalPromptShown||!isComplete())return;finalPromptShown=true;
      const mask=document.createElement('div');mask.id='tbs-final-mask';mask.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px';
      mask.innerHTML='<div style="width:min(430px,92vw);background:#171c24;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:28px;color:#eee;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)"><div style="font-size:18px;font-weight:700;letter-spacing:3px;margin-bottom:12px">全部核心谜题已解答</div><div style="font-size:13px;color:#aab2bd;line-height:1.8;margin-bottom:22px">最终抉择已经解锁。即使稍后关闭或刷新页面，入口也会保留。</div><div style="display:flex;gap:10px;justify-content:center"><button id="tbs-final-later" style="padding:10px 18px;border:1px solid #4b5360;background:transparent;color:#cbd1d8;border-radius:6px;cursor:pointer">稍后</button><button id="tbs-final-go" style="padding:10px 18px;border:0;background:#c41e3a;color:white;border-radius:6px;cursor:pointer;font-weight:700">进入最终抉择</button></div></div>';
      document.body.appendChild(mask);
      mask.querySelector('#tbs-final-later').onclick=()=>mask.remove();
      mask.querySelector('#tbs-final-go').onclick=goEnding;
    }

    // 原代码的浏览器最大化按钮调用 maxApp('browser')，但未定义 maxApp；补齐这一实际运行时错误。
    if(typeof window.maxApp!=='function'){
      window.maxApp=function(app){
        const win=document.getElementById('win-'+app);
        if(!win)return;
        win.classList.toggle('maximized');
        win.classList.add('show');
        try{openApps.add(app);updateTaskbar()}catch(e){}
      };
    }

    // 触屏设备通常不会稳定产生 dblclick；仅对 touch/pen 用单次点按打开桌面应用，PC 仍保留原双击逻辑。
    document.querySelectorAll('.desktop-icon[data-app]').forEach(icon=>{
      icon.addEventListener('pointerup',function(e){
        if(e.pointerType==='touch'||e.pointerType==='pen'){
          const app=this.dataset.app;if(app){e.preventDefault();openApp(app)}
        }
      },{passive:false});
    });

    const saved=safeRead();
    if(saved&&saved.progress){
      ['q1','q2','q3','q4'].forEach(k=>{if(saved.progress[k])progress[k]=true});
      try{['一','二','三','四'].forEach((n,i)=>{if(progress['q'+(i+1)]){const label='第'+n+'问解答完成';if(Array.isArray(clues)&&!clues.includes(label))clues.push(label)}})}catch(e){}
    }

    const originalCheckAllProgress=checkAllProgress;
    checkAllProgress=function(){
      safeWrite();ensureFinalButton();
      if(isComplete()){
        try{showToast('全部谜题已解答！最终抉择已解锁');}catch(e){}
        setTimeout(showFinalModal,450);
        return;
      }
      if(typeof originalCheckAllProgress==='function'&&originalCheckAllProgress!==checkAllProgress){
        // 未完成时原函数没有副作用，但不再调用其 confirm 分支，避免浏览器弹窗状态差异。
      }
    };

    const originalCheckAnswer=checkAnswer;
    checkAnswer=function(num){
      const ret=originalCheckAnswer(num);
      setTimeout(()=>{safeWrite();ensureFinalButton()},0);
      return ret;
    };

    document.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&document.getElementById('answer-window')?.classList.contains('show')){
        const input=document.getElementById('ans-input');if(document.activeElement===input&&currentAnswer){e.preventDefault();checkAnswer(currentAnswer)}
      }
    });
    document.addEventListener('click',function(e){
      const a=e.target.closest&&e.target.closest('a[href="ending.html"]');if(a){e.preventDefault();goEnding()}
    });

    ensureFinalButton();
    if(isComplete()){
      try{showToast('已恢复 4 / 4 推理进度，可继续进入最终抉择');}catch(e){}
    }
    window.addEventListener('pagehide',safeWrite);
  }

  function inject(html){
    const patch='<script>('+gameHotfix.toString()+')();<\/script>';
    if(/<\/body\s*>/i.test(html))return html.replace(/<\/body\s*>/i,patch+'</body>');
    return html+patch;
  }
  fetch('game.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{document.open();document.write(inject(html));document.close()}).catch(err=>{
    document.getElementById('loader').innerHTML='<div><b>调查系统载入失败</b><p>无法读取 game.html。请确认该文件与本文件位于同一目录。<br>'+String(err.message).replace(/[<>]/g,'')+'</p><button class="retry" onclick="location.reload()">重新载入</button></div>';
  });
})();
</script></body></html>
