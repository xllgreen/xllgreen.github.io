<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热搜盲区 · HOT SEARCH BLIND SPOT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e17;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans SC",sans-serif;overflow-x:hidden}
.hero{position:relative;height:100vh;min-height:680px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:url('cover_final.jpg') center/cover no-repeat;z-index:1}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,23,0.5) 0%,rgba(10,14,23,0.3) 40%,rgba(10,14,23,0.85) 80%,rgba(10,14,23,1) 100%)}
.hero-bg::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(10,14,23,0.6) 100%);z-index:2}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);z-index:3;pointer-events:none}
.floating-news{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.floating-news span{position:absolute;color:rgba(255,255,255,0.06);font-size:13px;white-space:nowrap;animation:floatUp 20s linear infinite}
.floating-news span:nth-child(1){top:80%;left:5%;animation-duration:25s}
.floating-news span:nth-child(2){top:90%;left:30%;animation-duration:30s;animation-delay:-5s}
.floating-news span:nth-child(3){top:85%;left:60%;animation-duration:22s;animation-delay:-10s}
.floating-news span:nth-child(4){top:95%;left:80%;animation-duration:28s;animation-delay:-3s}
.floating-news span:nth-child(5){top:75%;left:15%;animation-duration:35s;animation-delay:-15s}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-120vh);opacity:0}}
.hero-content{position:relative;z-index:10;text-align:center;padding:0 40px;animation:heroFadeIn 1.5s ease}
@keyframes heroFadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.game-tag{display:inline-block;font-size:13px;letter-spacing:6px;color:#c41e3a;border:1px solid rgba(196,30,58,0.4);padding:6px 20px;border-radius:2px;margin-bottom:30px;background:rgba(196,30,58,0.08);backdrop-filter:blur(4px)}
.game-title{font-size:clamp(60px,10vw,140px);font-weight:900;letter-spacing:12px;color:#fff;text-shadow:0 0 60px rgba(196,30,58,0.4),0 4px 20px rgba(0,0,0,0.8);line-height:1;margin-bottom:12px}
.game-subtitle{font-size:clamp(14px,2vw,22px);letter-spacing:8px;color:rgba(255,255,255,0.35);font-weight:300;margin-bottom:40px;text-transform:uppercase}
.game-tagline{font-size:clamp(16px,2.5vw,22px);color:rgba(255,255,255,0.7);letter-spacing:4px;font-weight:300;line-height:2}
.game-tagline .accent{color:#c41e3a;font-weight:500}
.scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,0.3);font-size:12px;letter-spacing:3px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}
.start-section{text-align:center;padding:60px 40px 100px}
.start-btn{display:inline-block;font-size:20px;font-weight:700;letter-spacing:8px;color:#fff;background:linear-gradient(135deg,#c41e3a,#8b0000);padding:18px 60px;border-radius:4px;text-decoration:none;transition:all 0.3s;box-shadow:0 8px 30px rgba(196,30,58,0.3);position:relative;overflow:hidden}
.start-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);opacity:0;transition:opacity 0.3s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(196,30,58,0.5)}
.start-btn:hover::before{opacity:1}.start-btn:active{transform:translateY(0)}
.start-hint{margin-top:20px;font-size:13px;color:#555;letter-spacing:2px}
.recovery-link{display:inline-block;margin-top:18px;color:#777;font-size:12px;letter-spacing:1px;text-decoration:none;border-bottom:1px dashed #555;padding-bottom:3px;transition:color .2s,border-color .2s}
.recovery-link:hover{color:#c41e3a;border-color:#c41e3a}
.footer{text-align:center;padding:30px;font-size:12px;color:#444;border-top:1px solid rgba(255,255,255,0.03);letter-spacing:1px}
@media(max-width:768px){.game-title{letter-spacing:6px}.start-section{padding:50px 20px 80px}.start-btn{font-size:17px;letter-spacing:5px;padding:16px 38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

    <span>化工园区存在违规排放 已立案查处</span><span>张明远今晨从跨江大桥坠亡 初步排除他杀</span><span>全市水质全面检测启动 结果将及时公布</span><span>我市自来水水质检测各项指标正常</span><span>个别小区出现季节性流感聚集 与水质无关</span>
  </div>
  <div class="hero-content"><div class="game-tag">现代现实题材 · 社会悬疑推理</div><h1 class="game-title">热搜盲区</h1><div class="game-subtitle">HOT SEARCH BLIND SPOT</div><p class="game-tagline">在信息洪流中，寻找<span class="accent">被掩盖的真相</span></p></div>
  <div class="scroll-hint">向下滚动 了解更多</div>
</section>
<section class="start-section">
  <a href="game-fixed.html" class="start-btn">开始调查</a>
  <p class="start-hint">点击进入调查员系统 · 推荐使用 PC / 平板浏览器游玩</p>
  <a href="ending-fixed.html" class="recovery-link" title="仅用于已完成四问但终章未能打开的旧存档玩家">已完成四问但未进入终章？恢复最终抉择</a>
</section>
<div class="footer">《热搜盲区》· HOT SEARCH BLIND SPOT · 献给每一个寻找真相的人</div>
</body>
</html>
